`;
  document.head.insertAdjacentHTML('beforeend', `<style id="doc-css">${DOC_CSS}</style>`);

  // Every bit of text set in a family's own font is recorded, so the document can load
  // just those letters (Google Fonts' text= subsetting keeps each font to a kilobyte or two).
  let docFonts = new Map();
  let docFontHrefs = [];
  let docFontsReady = Promise.resolve();

  function ff(f, text, cls = '') {
    if (!docFonts.has(f.preview.q)) docFonts.set(f.preview.q, new Set());
    const chars = docFonts.get(f.preview.q);
    for (const ch of text) chars.add(ch);
    const family = `"${f.name.replace(/["\\]/g, '\\$&')}", system-ui, sans-serif`;
    return `<span class="ff ${cls}" style="font-family:${esc(family)};font-weight:${f.preview.weight};font-style:${f.preview.italic ? 'italic' : 'normal'}">${esc(text)}</span>`;
  }

  const fontHref = (entries) => {
    const chars = new Set();
    entries.forEach(([, set]) => set.forEach((c) => chars.add(c)));
    return `https://fonts.googleapis.com/css2?${entries.map(([q]) => 'family=' + q).join('&')}&text=${encodeURIComponent([...chars].join(''))}&display=swap`;
  };

  function loadStylesheet(href) {
    return new Promise((resolve, reject) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      link.dataset.docFont = '1';
      link.onload = () => resolve(href);
      link.onerror = () => { link.remove(); reject(new Error(href)); };
      document.head.appendChild(link);
    });
  }

  // Batches of 8 families per request; if a batch fails, retry its families one by one.
  function loadDocFonts() {
    const entries = [...docFonts];
    const batches = [];
    for (let i = 0; i < entries.length; i += 8) batches.push(entries.slice(i, i + 8));
    docFontHrefs = [];
    docFontsReady = Promise.all(batches.map((batch) =>
      loadStylesheet(fontHref(batch)).then((h) => docFontHrefs.push(h))
        .catch(() => Promise.all(batch.map((e) => loadStylesheet(fontHref([e])).then((h) => docFontHrefs.push(h)).catch(() => {}))))));
  }

  const sevPill = (level) => `<span class="pill sev-${level}">${SEVERITY[level].label}</span>`;
  const confPill = (c) => `<span class="pill conf-${c}">${['', 'Low', 'Medium', 'High'][c]}</span>`;
  const docLink = (hash, text) => `<a href="${esc(appUrl(hash))}">${text}</a>`;
  const proposalHash = (fams) => 'doc=proposal&for=' + encodeURIComponent(fams.slice(0, MAX_PROPOSAL_FAMILIES).map((f) => f.name).join('|'));
  const dateText = (ts) => new Date(ts).toLocaleString(undefined, { dateStyle: 'long', timeStyle: 'short' });
  const SPECIMEN_WORD = 'Hamburgefonstiv';

  // A 0–100 scale for one tag: real fonts placed at their scores, and the proposed score.
  function scaleDiagram(subject, p, exemplars) {
    const items = exemplars.map((e) => ({ ...e, label: e.g.name }));
    const est = (label) => Math.min(48, (label.length * 7.6 + 34) / 8.4); // label width in % of an ~840px plot
    const lanesEnd = [];
    for (const it of items) {
      const w = est(it.label);
      const start = it.v - (w * it.v) / 100, end = start + w;
      let lane = lanesEnd.findIndex((e) => e < start - 0.5);
      if (lane === -1) lane = lanesEnd.length < 4 ? lanesEnd.length : lanesEnd.indexOf(Math.min(...lanesEnd));
      lanesEnd[lane] = end;
      it.lane = lane;
    }
    const laneH = 30, top = 34;
    const height = top + Math.max(1, lanesEnd.length) * laneH + 6;
    const marker = (v, inner, cls, y) =>
      `<div class="mk ${cls}" style="left:${v}%;top:${y}px;transform:translateX(-${v}%)"><span class="tick" style="left:${v}%"></span>${inner}</div>`;
    const band = p.lo != null ? `<div class="band" style="left:${p.lo}%;width:${Math.max(1, p.hi - p.lo)}%"></div>` : '';
    const desc = state.model.stats.descriptions[p.path];
    return `
      <figure class="scale">
        <figcaption><code>${esc(p.path)}</code>${desc ? ` <span class="muted">· ${esc(desc)}</span>` : ''} · proposed <b>${p.score}</b>${p.lo != null ? ` <span class="muted">(similar families ${p.lo}–${p.hi})</span>` : ' <span class="muted">(catalog average; no similar family has this tag)</span>'} ${confPill(p.confidence)}</figcaption>
        <div class="plot" style="height:${height}px">
          ${band}
          ${marker(p.score, `${ff(subject, subject.name)}<b>${p.score}</b>`, 'cand', 4)}
          ${items.map((it) => marker(it.v, `${ff(it.g, it.label)}<b>${Math.round(it.v)}</b>`, it.kind === 'neighbour' ? 'nbr' : '', top + it.lane * laneH)).join('')}
        </div>
        <div class="axis">${[0, 25, 50, 75, 100].map((x) => `<span style="left:${x}%">${x}</span>`).join('')}</div>
      </figure>`;
  }

  // Reference fonts for a tag: up to 3 similar families, plus well-known families near the low,
  // middle and high end of the tag's scores.
  function exemplarsFor(subject, p) {
    const idx = similarityIndex();
    const list = idx.tagValues.get(p.path) || [];
    const picks = [];
    const add = (g, v, kind) => { if (g !== subject && !picks.some((x) => x.g === g)) picks.push({ g, v, kind }); };
    p.vals.slice().sort((a, b) => b.w - a.w).slice(0, 3).forEach((o) => add(o.g, o.v, 'neighbour'));
    const values = list.map((o) => o.v).sort((a, b) => a - b);
    const at = (q) => values[Math.floor((values.length - 1) * q)];
    for (const target of [at(0.05), at(0.5), at(0.95)]) {
      if (target == null) continue;
      const near = list.filter((o) => Math.abs(o.v - target) <= 6 && !picks.some((x) => x.g === o.f)).sort((a, b) => byPopularity(a.f, b.f))[0];
      if (near) add(near.f, near.v, 'reference');
    }
    return picks.sort((a, b) => a.v - b.v);
  }

  // ---------------------------------------------------------------------------
  // Documents: tagging proposals
  // ---------------------------------------------------------------------------
  function proposalDoc(names) {
    const m = state.model;
    const fams = names.map((n) => m.byName.get(n)).filter(Boolean);
    if (!fams.length) return `<h1>No families to propose for</h1><p>None of the requested families are in the catalog.</p>`;
    const cal = calibrate();
    const props = fams.map(propose);
    const totalRows = props.reduce((a, p) => a + p.csv.length, 0);
    const intro = `
      <div class="eyebrow">Tagging proposal</div>
      <h1>${fams.length === 1 ? `Proposed tags for ${esc(fams[0].name)}` : `Proposed tags for ${plural(fams.length, 'family', 'families')}`}</h1>
      <p class="lede">Suggested tags and scores worked out from how the most similar tagged families are tagged, with diagrams that set each family against real fonts on every tag's 0–100 scale. These are starting points to review in the <a href="${TAGGER_URL}">GF Tagger</a>, not final scores.</p>
      <p class="muted small">Generated ${esc(dateText(Date.now()))} from data fetched ${esc(dateText(state.meta.fetchedAt))}. ${plural(totalRows, 'suggested row')} in total.</p>`;
    const toc = fams.length > 1 ? `
      <h2>Families in this proposal</h2>
      <table class="toc"><thead><tr><th>Family</th><th>Now</th><th class="num">Suggested rows</th><th>Top classification</th><th>Severity</th></tr></thead><tbody>
      ${props.map((p) => `<tr><td><a href="#prop-${slug(p.family.name)}">${ff(p.family, p.family.name, 'fam-name')}</a><div class="muted small">${esc(p.family.category)}</div></td>
        <td class="small">${p.family.tagged ? `${taggerPct(p.family.tagger)} tagger · ${p.family.expected}% expected` : 'No tags'}</td>
        <td class="num">${p.csv.length}</td>
        <td>${p.classification[0] ? `<code>${esc(trimSlash(p.classification[0].path))}</code>` : '<span class="faint">—</span>'}</td>
        <td>${p.family.severity ? sevPill(p.family.severity) : '<span class="faint">—</span>'}</td></tr>`).join('')}
      </tbody></table>` : '';
    const allRows = props.flatMap((p) => p.csv);
    const combined = fams.length > 1 ? `
      <h2>All suggested families.csv rows</h2>
      <p class="muted">Every suggested row from the sections below, in the format of <code>tags/all/families.csv</code> (family, axis position, tag, score). Review the scores first; the tagger can also import edits as a pull request.</p>
      <pre>${esc(allRows.join('\n'))}</pre>` : '';
    return intro + reliabilityNote(cal) + toc + props.map((p) => proposalSection(p, cal, fams.length > 1)).join('') + combined;
  }

  const slug = (name) => name.toLowerCase().replace(/[^a-z0-9]+/g, '-');

  function reliabilityNote(cal) {
    return `
      <div class="note"><b>How far to trust these.</b> The method was checked just now on ${cal.n} families that are already tagged, by hiding their tags and predicting them:
        suggested Expressive scores were off by <b>${cal.expressiveError.toFixed(0)} points</b> on average (using each tag's catalog average instead: ${cal.expressiveBaseline.toFixed(0)}),
        Quality scores by <b>${cal.qualityError.toFixed(0)}</b>;
        ${pct(cal.precision)} of suggested Expressive tags were ones the family really has, and they found ${pct(cal.recall)} of its real ones;
        the top classification was right ${pct(cal.top1)} of the time and the right one was in the top three ${pct(cal.top3)} of the time.
        Classification is the weakest part, so pick it by eye from the comparison diagrams.</div>`;
  }

  function proposalSection(p, cal, many) {
    const f = p.family, s = state.model.stats;
    const lead = p.neighbours.slice(0, 3);
    const relativeText = p.relatives.length
      ? `Its closest relatives are ${listText(p.relatives.slice(0, 3).map((nb) => `${esc(nb.g.name)} (${esc(nb.why.filter((w) => ['same superfamily', 'related name', 'same designer'].includes(w)).join(', '))})`))}, so the suggestions lean on how those were tagged.`
      : `It has no close relatives in the catalog (no superfamily, related name or shared designer), so the suggestions come from ${esc(f.category || 'similar')} families like ${listText(lead.map((nb) => esc(nb.g.name)))} and sit close to what's typical; check them carefully.`;
    const now = f.tagged
      ? `${esc(f.name)} has ${plural(f.tags.length, 'tag')} (tagger ${taggerPct(f.tagger)}, expected ${f.expected}%)${f.issues.length ? `, with ${listText(f.issues.map((i) => i.label.toLowerCase()))}` : ''}.`
      : `${esc(f.name)} has no tags yet.`;
    const counts = [];
    if (p.quality.length) counts.push(plural(p.quality.length, 'Quality tag'));
    if (p.tags.length) counts.push(plural(p.tags.length, 'more tag', 'more tags').replace('more ', p.tags.every((t) => t.group === 'Expressive') ? 'Expressive ' : ''));
    if (p.classification[0]) counts.push(`a classification (${esc(p.classification[0].path)}, backed by ${pct(p.classification[0].support)} of the weighted vote)`);
    const high = [...p.quality, ...p.tags].filter((x) => x.confidence === 3).length;
    const summary = counts.length
      ? `This proposal suggests ${listText(counts)}. ${high ? `${plural(high, 'suggestion')} ${high === 1 ? 'has' : 'have'} high confidence.` : 'None of the suggestions has high confidence, so treat them as a rough first pass.'}`
      : `Its similar families don't point to any missing tags, so there's nothing to add${p.disagreements.length ? ', but a few existing scores are worth a second look (below)' : ''}.`;

    const head = `
      <section class="fam" id="prop-${slug(f.name)}">
        ${many ? '<div class="eyebrow">Tagging proposal</div>' : ''}
        <h2 style="${many ? 'border-top:0;margin-top:8px;padding-top:0' : ''}">${ff(f, f.name, 'fam-name')}${f.latin ? '' : ` <span class="muted small" style="font-weight:500">${esc(f.name)}</span>`}</h2>
        <p class="muted small">${esc(f.category || 'Uncategorized')}${f.designers.length ? ` · ${esc(f.designers.join(', '))}` : ''}${f.added ? ` · added ${esc(f.added)}` : ''}${Number.isFinite(popularityOf(f)) ? ` · #${fmt.format(f.popularity)} in popularity` : ''}${f.axes.length ? ` · variable (${esc(f.axes.join(', '))})` : ''}${f.severity ? ` · ${sevPill(f.severity)}` : ''}</p>
        <div class="specimen">
          <div class="s1">${ff(f, 'The quick brown fox jumps')}</div>
          <div class="s2">${ff(f, SPECIMEN_WORD + ' 0123456789')}</div>
          <div class="s3">${ff(f, 'Sphinx of black quartz, judge my vow. Pack my box with five dozen liquor jugs.')}</div>
          ${f.latin ? '' : '<p class="small muted">This family has no Latin glyphs, so the samples above fall back to a system font.</p>'}
        </div>
        <h3>Summary</h3>
        <p>${now} ${relativeText} ${summary}</p>
        ${f.axes.length ? `<p class="muted small">This is a variable font. The tagger can score a tag at specific axis positions; these suggestions are single scores, so for tags that change across ${esc(f.axes.join(' or '))}, score the extremes in the tagger instead.</p>` : ''}`;

    const neighbours = `
      <h3>Most similar tagged families</h3>
      <p class="muted small">The ${p.neighbours.length} tagged families most like ${esc(f.name)} by catalog metadata, each set in its own font. The bar shows how similar each one is; closer families count much more in the suggestions.</p>
      <div class="grid">
        ${p.neighbours.map((nb) => `
          <div class="nb">
            <div class="sample">${ff(nb.g, SPECIMEN_WORD)}</div>
            <div class="name">${esc(nb.g.name)}</div>
            <div class="bar"><span style="width:${Math.round((nb.sim / MAX_SIMILARITY) * 100)}%"></span></div>
            <div class="small muted">${esc(nb.why.join(' · ') || 'similar style')} · tagger ${taggerPct(nb.g.tagger)}</div>
          </div>`).join('')}
      </div>`;

    let classification = '';
    if (p.classification.length) {
      const idx = similarityIndex();
      const examplesFor = (c) => {
        const fromNeighbours = c.vals.slice().sort((a, b) => b.w - a.w).map((o) => o.g);
        const popular = (idx.tagValues.get(c.path) || []).map((o) => o.f).filter((g) => g.category === f.category).sort(byPopularity);
        const picks = [];
        for (const g of [...fromNeighbours, ...popular]) if (g !== f && !picks.includes(g) && picks.length < 3) picks.push(g);
        return picks;
      };
      classification = `
        <h3>Classification</h3>
        <p>${f.tagged ? `${esc(f.name)} has no tag in ${esc(f.parts.expected.label)}.` : `${esc(f.name)} needs a classification tag.`} The three candidates its similar families use most are below, each with fonts that carry it. Pick the column ${esc(f.name)} looks most like; the first is the suggestion.</p>
        <div class="specimen" style="padding:10px 14px"><div class="s2">${ff(f, SPECIMEN_WORD)}</div><div class="small muted">${esc(f.name)}</div></div>
        <div class="cls">
          ${p.classification.map((c, i) => `
            <div class="col ${i === 0 ? 'pick' : ''}">
              <div><code>${esc(c.path)}</code> ${i === 0 ? '<span class="pill conf-2">Suggested</span>' : ''}</div>
              <div class="small muted">${pct(c.support)} of the weighted vote · typical score ${c.score} · ${confPill(c.confidence)}</div>
              ${examplesFor(c).map((g) => `<div class="ex"><span class="sample">${ff(g, SPECIMEN_WORD)}</span><span class="small muted">${esc(g.name)}</span></div>`).join('')}
            </div>`).join('')}
        </div>`;
    }

    const scored = [...p.quality, ...p.tags];
    const table = scored.length || p.classification.length ? `
      <h3>Suggested tags</h3>
      <table>
        <thead><tr><th>Tag</th><th class="num">Score</th><th class="num">Similar families</th><th class="num">Support</th><th>Confidence</th></tr></thead>
        <tbody>
          ${[...scored, ...(p.classification[0] ? [p.classification[0]] : [])].map((x) => `<tr>
            <td><code>${esc(x.path)}</code>${s.descriptions[x.path] ? `<div class="small muted">${esc(s.descriptions[x.path])}</div>` : ''}</td>
            <td class="num"><b>${x.score}</b></td>
            <td class="num">${x.lo != null ? `${x.lo}–${x.hi}` : '<span class="faint">catalog avg</span>'}</td>
            <td class="num">${x.count ? `${x.count} of ${p.neighbours.length}` : '—'}</td>
            <td>${confPill(x.confidence)}</td></tr>`).join('')}
        </tbody>
      </table>
      <p class="small muted">Score is the similarity-weighted average of the similar families that have the tag; the range is one standard deviation either side. Similar families vote with weights that grow steeply with similarity, so close relatives count most. Confidence is High when at least 70% of the weighted vote agrees and the spread is 15 points or less${p.relatives.length ? '' : ' (capped at Medium here, as there are no close relatives)'}, Medium at 50% and 25 points.</p>` : '';

    const diagrams = scored.length ? `
      <h3>Where ${esc(f.name)} would sit</h3>
      <p class="muted small">Each scale shows the suggested score (filled), the range across similar families (shaded), similar families that have the tag (outlined in blue) and well-known fonts at the low, middle and high end, all set in their own fonts.</p>
      ${scored.slice(0, 14).map((x) => scaleDiagram(f, x, exemplarsFor(f, x))).join('')}
      ${scored.length > 14 ? `<p class="muted small">${scored.length - 14} more suggestions are in the table above.</p>` : ''}` : '';

    const maybe = p.maybe.length ? `
      <h3>Worth considering</h3>
      <p class="muted small">Tags with 30–50% of the weighted vote. Not in the suggested rows.</p>
      <p>${p.maybe.map((x) => `<code>${esc(x.path)}</code> <span class="muted small">~${x.score} (${pct(x.support)})</span>`).join(' · ')}</p>` : '';

    const disagreements = p.disagreements.length ? `
      <h3>Existing scores worth a second look</h3>
      <p class="muted small">Tags ${esc(f.name)} already has, scored 30+ points away from what at least 3 similar families give them. Not necessarily wrong, but worth checking.</p>
      <table><thead><tr><th>Tag</th><th class="num">${esc(f.name)}</th><th class="num">Similar families</th></tr></thead><tbody>
        ${p.disagreements.slice(0, 8).map((d) => `<tr><td><code>${esc(d.tag.path)}</code></td><td class="num">${esc(d.tag.score)}</td><td class="num">${d.peer.score} (${d.peer.lo}–${d.peer.hi})</td></tr>`).join('')}
      </tbody></table>` : '';

    const rows = p.csv.length ? `
      <h3>families.csv rows</h3>
      <p class="muted small">Ready to paste into <code>tags/all/families.csv</code> once reviewed: the suggested Quality and other tags${p.classification[0] ? ', plus the suggested classification' : ''}. Static rows (no axis position).</p>
      <pre>${esc(p.csv.join('\n'))}</pre>` : '';

    return head + neighbours + classification + table + diagrams + maybe + disagreements + rows + '</section>';
  }

  // ---------------------------------------------------------------------------
  // Documents: severity report
  // ---------------------------------------------------------------------------
  function severityDoc() {
    const m = state.model, t = m.totals, s = m.stats, ts = s.tagger;
    const fams = m.families;
    const levels = [4, 3, 2, 1].map((level) => ({ level, fams: fams.filter((f) => f.severity === level).sort(byPopularity) }));
    const count = (level) => levels.find((l) => l.level === level).fams.length;
    const anyGap = fams.filter((f) => f.severity >= 2);
    const untagged = levels[0].fams;
    const added = untagged.map((f) => f.added).filter(Boolean).sort();
    const classMissing = fams.filter((f) => hasIssue(f, 'classification'));
    const strongCls = classMissing.filter((f) => f.parts.expected !== ANY_CLASSIFICATION).sort(byPopularity);
    const displayCls = classMissing.filter((f) => f.parts.expected === ANY_CLASSIFICATION).sort(byPopularity);
    const classByCat = CATEGORIES.map((c) => [c, classMissing.filter((f) => f.category === c).length]).filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
    const qualityMissing = fams.filter((f) => hasIssue(f, 'quality'));
    const thin = fams.filter((f) => hasIssue(f, 'expressive'));
    const leastExpressive = m.expressiveVocab.slice().reverse().slice(0, 4);
    const colours = { 4: '#be123c', 3: '#ea580c', 2: '#f59e0b', 1: '#818cf8', 0: '#e4e4e7' };

    const findings = [];
    if (untagged.length) findings.push(`<b>${plural(untagged.length, 'family', 'families')} ${untagged.length === 1 ? 'has' : 'have'} no tags at all</b>${added.length ? `, all added between ${esc(added[0])} and ${esc(added[added.length - 1])}` : ''}.`);
    if (count(3)) findings.push(`<b>${plural(count(3), 'more family', 'more families')}</b> ${count(3) === 1 ? 'is' : 'are'} missing tags that nearly every family has: ${[qualityMissing.length ? `${qualityMissing.length} without all Quality tags` : '', strongCls.length ? `${strongCls.length} Sans Serif, Serif, Handwriting or Monospace families without the classification tag their category calls for` : ''].filter(Boolean).join(' and ')}${qualityMissing.length && strongCls.some((f) => hasIssue(f, 'quality')) ? ' (some have both)' : ''}.`);
    if (classMissing.length) findings.push(`Missing classification is the most common gap (${plural(classMissing.length, 'family', 'families')}): ${classByCat.map(([c, n]) => `${n} ${esc(c)}`).join(', ')}.`);
    if (thin.length) findings.push(`${plural(thin.length, 'family', 'families')} ${thin.length === 1 ? 'has' : 'have'} ${THIN_EXPRESSIVE} or fewer Expressive tags, against a median of ${s.expressiveMedian}.`);
    findings.push(`The least-scored Expressive tags across the catalog are ${listText(leastExpressive.map((p) => `<code>${esc(leaf(p))}</code> (${pct(s.share(p))})`))} of tagged families.`);
    findings.push(`On the tagger's own measure the catalog is <b>${ts.completeness.toFixed(1)}% complete</b>; the median family has ${taggerPct(ts.median)} of the ${ts.total} tags.`);

    const head = `
      <div class="eyebrow">Severity report</div>
      <h1>Where Google Fonts tagging is lacking</h1>
      <p class="lede">Every family in the catalog checked against the tag database, with the gaps ranked by how sure we can be that tags are missing. Within each level, the most-used families come first, since gaps there affect the most people.</p>
      <p class="muted small">Generated ${esc(dateText(Date.now()))} from data fetched ${esc(dateText(state.meta.fetchedAt))}: ${fmt.format(t.catalog)} catalog families, ${fmt.format(t.tagged)} with tags. Sources: <a href="${META_URL}">Google Fonts catalog</a>, <a href="${CSV_URL}">families.csv</a>, <a href="https://github.com/googlefonts/tagger">GF Tagger</a> tag list.</p>
      <div class="cards">
        ${[4, 3, 2, 1].map((l) => `<div class="card"><div class="label">${SEVERITY[l].label}</div><div class="big" style="color:${colours[l]}">${fmt.format(count(l))}</div><div class="small muted">${sharePct(count(l) / t.catalog)} of the catalog</div></div>`).join('')}
        <div class="card"><div class="label">No gaps found</div><div class="big">${fmt.format(fams.filter((f) => !f.severity).length)}</div><div class="small muted">${sharePct(fams.filter((f) => !f.severity).length / t.catalog)} of the catalog</div></div>
      </div>
      <div class="stack">${[4, 3, 2, 1, 0].map((l) => { const n = fams.filter((f) => f.severity === l).length; return n ? `<span title="${l ? SEVERITY[l].label : 'No gaps'}: ${n}" style="width:${(n / t.catalog) * 100}%;background:${colours[l]}"></span>` : ''; }).join('')}</div>
      <div class="legend">${[4, 3, 2, 1, 0].map((l) => `<span><i style="background:${colours[l]}"></i>${l ? SEVERITY[l].label : 'No gaps'}</span>`).join('')}</div>
      <h2>Key findings</h2>
      <ul>${findings.map((x) => `<li>${x}</li>`).join('')}</ul>`;

    const definitions = `
      <h2>How severity is assigned</h2>
      <table><thead><tr><th>Level</th><th>Rule</th><th>Why</th><th class="num">Families</th></tr></thead><tbody>
        <tr><td>${sevPill(4)}</td><td>No rows in families.csv.</td><td>Tag-based browsing and filters can't surface the family at all.</td><td class="num">${count(4)}</td></tr>
        <tr><td>${sevPill(3)}</td><td>Missing a <code>/Quality</code> tag; or a Sans Serif, Serif, Handwriting or Monospace family with no tag in its classification group.</td><td>${pct(s.qualityFullShare)} of tagged families have every Quality tag, and ${pct(Math.min(...['Sans Serif', 'Serif', 'Handwriting', 'Monospace'].map((c) => s.classificationShare[c] || 0)))}–${pct(Math.max(...['Sans Serif', 'Serif', 'Handwriting', 'Monospace'].map((c) => s.classificationShare[c] || 0)))} of those categories are classified, so a gap is almost certainly an omission.</td><td class="num">${count(3)}</td></tr>
        <tr><td>${sevPill(2)}</td><td>${THIN_EXPRESSIVE} or fewer <code>/Expressive</code> tags; or a Display family with no classification tag.</td><td>Probably under-tagged: 3 in 4 families have ${s.expressiveTarget}+ Expressive tags, and ${pct(s.classificationShare.Display || 0)} of Display families are classified.</td><td class="num">${count(2)}</td></tr>
        <tr><td>${sevPill(1)}</td><td>No flagged gaps, but in the bottom 10% of tagged families by tagger % (under ${taggerPct(ts.p10)}).</td><td>Thinly tagged compared with the rest of the catalog; worth a pass when time allows.</td><td class="num">${count(1)}</td></tr>
      </tbody></table>
      <p class="muted small">Families with a <code>/Special use</code> tag (barcodes, redaction, symbols) aren't flagged for Expressive or classification gaps.</p>`;

    const distribution = `
      <h2>Coverage across the catalog</h2>
      <p>How many of the tagger's ${ts.total} tags each family has, as a share. Most families sit between 15% and 25%; the dashed lines mark the bottom 10% (${taggerPct(ts.p10)}) and the median (${taggerPct(ts.median)}).</p>
      ${histogram(fams, ts)}
      <h3>Expected coverage</h3>
      <p class="muted small">Share of families at each Expected level (Quality, Expressive and Classification parts averaged).</p>
      ${expectedStack(fams)}`;

    const sections = levels.map(({ level, fams: list }) => severitySection(level, list)).join('');

    const tagsSection = `
      <h2>Gaps by tag</h2>
      <p>Share of tagged families scored on each tag. Expressive tags are picked selectively, so low numbers aren't all omissions, but the least-used ones are where a focused pass in the tagger's Todo panel (filtered to one tag) would add the most.</p>
      <h3>Expressive</h3>
      ${tagBars(m.expressiveVocab.slice().sort((a, b) => s.share(a) - s.share(b)), s)}
      <h3>Quality</h3>
      ${tagBars(s.qualityExpected, s)}
      <h3>Classification, by category</h3>
      <table><thead><tr><th>Category</th><th>Expected group</th><th>Classified</th><th class="num">Missing</th></tr></thead><tbody>
        ${CATEGORIES.map((c) => `<tr><td>${esc(c)}</td><td><code>${esc(expectedFor(c).label)}</code></td><td><div class="hbar"><div class="bar"><span style="width:${(s.classificationShare[c] || 0) * 100}%"></span></div><span class="num small">${pct(s.classificationShare[c] || 0)}</span></div></td><td class="num">${classMissing.filter((f) => f.category === c).length}</td></tr>`).join('')}
      </tbody></table>`;

    const cats = `
      <h2>Gaps by category</h2>
      <table><thead><tr><th>Category</th><th class="num">Families</th><th class="num">Critical</th><th class="num">High</th><th class="num">Medium</th><th class="num">Low</th><th class="num">Avg tagger %</th></tr></thead><tbody>
        ${CATEGORIES.map((c) => { const list = fams.filter((f) => f.category === c); const by = (l) => list.filter((f) => f.severity === l).length; return `<tr><td>${esc(c)}</td><td class="num">${fmt.format(list.length)}</td><td class="num">${by(4)}</td><td class="num">${by(3)}</td><td class="num">${by(2)}</td><td class="num">${by(1)}</td><td class="num">${taggerPct(list.reduce((a, f) => a + f.tagger, 0) / Math.max(list.length, 1))}</td></tr>`; }).join('')}
      </tbody></table>`;

    const years = [...new Set(fams.map((f) => (f.added || '').slice(0, 4)).filter(Boolean))].sort();
    const byYear = `
      <h2>Gaps by year added</h2>
      <p>Share of each year's additions with a gap of Medium severity or worse. Newer additions are where untagged and thinly tagged families accumulate.</p>
      <table><thead><tr><th>Year</th><th class="num">Added</th><th class="num">With gaps</th><th>Share</th></tr></thead><tbody>
        ${years.slice(-10).reverse().map((y) => { const list = fams.filter((f) => (f.added || '').startsWith(y)); const g = list.filter((f) => f.severity >= 2).length; return `<tr><td>${y}</td><td class="num">${list.length}</td><td class="num">${g}</td><td><div class="hbar"><div class="bar"><span style="width:${(g / Math.max(list.length, 1)) * 100}%;background:${g / Math.max(list.length, 1) > 0.15 ? '#f59e0b' : '#4f46e5'}"></span></div><span class="num small">${pct(g / Math.max(list.length, 1))}</span></div></td></tr>`; }).join('')}
      </tbody></table>`;

    const steps = [];
    if (untagged.length) steps.push(`<b>Tag the ${plural(untagged.length, 'untagged family', 'untagged families')}.</b> ${docLink(proposalHash(untagged), 'Open proposals for all of them')}.`);
    if (qualityMissing.length) steps.push(`<b>Add the missing Quality tags</b> to ${listText(qualityMissing.slice(0, 6).map((f) => esc(f.name)))}${qualityMissing.length > 6 ? ` and ${qualityMissing.length - 6} more` : ''}. ${docLink(proposalHash(qualityMissing), 'Proposals')}.`);
    if (strongCls.length) steps.push(`<b>Classify ${plural(strongCls.length, 'Sans Serif, Serif, Handwriting or Monospace family', 'Sans Serif, Serif, Handwriting and Monospace families')}</b>, most popular first (${listText(strongCls.slice(0, 3).map((f) => esc(f.name)))}…). ${docLink('gap=classification&sort=severity', 'See them in the list')} or ${docLink(proposalHash(strongCls), `open proposals for the top ${Math.min(strongCls.length, MAX_PROPOSAL_FAMILIES)}`)}.`);
    if (thin.length) steps.push(`<b>Score more Expressive tags</b> for the ${plural(thin.length, 'family', 'families')} with ${THIN_EXPRESSIVE} or fewer. ${docLink('gap=expressive&sort=severity', 'See them')} · ${docLink(proposalHash(thin.sort(byPopularity)), 'proposals')}.`);
    if (displayCls.length) steps.push(`<b>Classify ${plural(displayCls.length, 'Display family', 'Display families')}</b> under <code>/Theme</code>, <code>/Sans</code>, <code>/Serif</code> or <code>/Script</code>. ${docLink(proposalHash(displayCls), 'Proposals')}.`);
    steps.push(`<b>Run focused passes on the least-used Expressive tags</b> (${listText(leastExpressive.slice(0, 3).map((p) => `<code>${esc(leaf(p))}</code>`))}) using the tagger's Todo panel with that tag as the filter.`);
    if (count(1)) steps.push(`<b>Review the ${plural(count(1), 'thinly tagged family', 'thinly tagged families')}</b> in the Low section when time allows. ${docLink('sort=least', 'Least tagged first')}.`);
    const next = `<h2>Recommended next steps</h2><ol>${steps.map((x) => `<li>${x}</li>`).join('')}</ol>`;

    return head + definitions + next + distribution + sections + tagsSection + cats + byYear;
  }

  function severitySection(level, list) {
    if (!list.length) return `<h2>${SEVERITY[level].label}</h2><p class="muted">No families at this level.</p>`;
    const titles = { 4: 'Untagged families', 3: 'Missing tags nearly every family has', 2: 'Probably under-tagged', 1: 'Thinly tagged' };
    const intros = {
      4: 'These families have no rows in families.csv. They are the highest priority: until they have tags, tag-based browsing can\'t surface them.',
      3: 'These families are missing a Quality tag, or the classification tag their category almost always has.',
      2: `These families have ${THIN_EXPRESSIVE} or fewer Expressive tags, or are Display families with no classification tag.`,
      1: 'No specific tag is flagged, but these families have fewer tags than 90% of the catalog.',
    };
    const reasons = (f) => (f.severity === 1
      ? `${f.taggerCount} of ${state.model.stats.tagger.total} tags`
      : f.issues.map((i) => esc(i.label)).join('; '));
    return `
      <h2>${sevPill(level)} ${titles[level]} (${fmt.format(list.length)})</h2>
      <p>${intros[level]} Ordered by popularity, most-used first. ${docLink(proposalHash(list), list.length > MAX_PROPOSAL_FAMILIES ? `Proposals for the top ${MAX_PROPOSAL_FAMILIES}` : 'Proposals for all of them')}.</p>
      <table><thead><tr><th class="num">#</th><th>Family</th><th class="num">Popularity</th><th class="num">Tagger</th><th class="num">Expected</th><th>What's missing</th><th></th></tr></thead><tbody>
        ${list.map((f, i) => `<tr>
          <td class="num faint">${i + 1}</td>
          <td>${ff(f, f.name, 'fam-name')}<div class="small muted">${esc(f.name)} · ${esc(f.category || 'Uncategorized')}${f.added ? ` · added ${esc(f.added)}` : ''}</div></td>
          <td class="num">${Number.isFinite(popularityOf(f)) ? '#' + fmt.format(f.popularity) : '—'}</td>
          <td class="num">${taggerPct(f.tagger)}</td>
          <td class="num">${f.expected}%</td>
          <td class="small">${reasons(f)}</td>
          <td class="small">${docLink(proposalHash([f]), 'Proposal')}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  function histogram(fams, ts) {
    const binW = 2, max = Math.max(36, Math.ceil(ts.max / binW) * binW);
    const bins = Array.from({ length: max / binW }, (_, i) => ({ lo: i * binW, n: 0 }));
    let zero = 0;
    fams.forEach((f) => { if (f.tagger === 0) zero++; else bins[Math.min(bins.length - 1, Math.floor(f.tagger / binW))].n++; });
    const W = 840, H = 190, L = 34, B = 26, T = 10;
    const top = Math.max(zero, ...bins.map((b) => b.n));
    const x = (p) => L + (p / max) * (W - L - 6);
    const y = (n) => T + (H - T - B) * (1 - n / top);
    const bars = bins.map((b) => `<rect x="${x(b.lo) + 1}" y="${y(b.n)}" width="${x(binW) - x(0) - 2}" height="${H - B - y(b.n)}" fill="${b.lo + binW <= ts.p10 ? '#f59e0b' : '#6366f1'}"><title>${b.lo}–${b.lo + binW}%: ${b.n} families</title></rect>`).join('');
    const zeroBar = zero ? `<rect x="${x(0) - 7}" y="${y(zero)}" width="6" height="${H - B - y(zero)}" fill="#be123c"><title>0%: ${zero} untagged families</title></rect><text x="${x(0) - 4}" y="${y(zero) - 5}" font-size="10" fill="#be123c" text-anchor="start">${zero} untagged</text>` : '';
    const ticks = Array.from({ length: max / 5 + 1 }, (_, i) => i * 5).map((p) => `<text x="${x(p)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#71717a">${p}%</text>`).join('');
    const yTicks = [0, Math.round(top / 2), top].map((n) => `<text x="${L - 6}" y="${y(n) + 3}" font-size="10" text-anchor="end" fill="#71717a">${n}</text>`).join('');
    const line = (p, label) => `<line x1="${x(p)}" x2="${x(p)}" y1="${T}" y2="${H - B}" stroke="#18181b" stroke-dasharray="3 3" stroke-width="1"/><text x="${x(p) + 4}" y="${T + 10}" font-size="10" fill="#18181b">${label}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram of tagger coverage across the catalog" font-family="Inter, system-ui, sans-serif">
      <line x1="${L}" x2="${W - 6}" y1="${H - B}" y2="${H - B}" stroke="#d4d4d8"/>${zeroBar}${bars}${ticks}${yTicks}
      ${line(ts.p10, 'bottom 10%')}${line(ts.median, 'median')}</svg>
      <div class="legend"><span><i style="background:#be123c"></i>Untagged (0%)</span><span><i style="background:#f59e0b"></i>Bottom 10%</span><span><i style="background:#6366f1"></i>Rest of the catalog</span></div>`;
  }

  function expectedStack(fams) {
    const parts = EXPECTED_PCT_FILTERS.slice(1).map((o, i) => ({ label: o.label.replace('Expected ', ''), n: fams.filter((f) => o.test(f.expected)).length, colour: ['#be123c', '#ea580c', '#f59e0b', '#818cf8', '#10b981'][i] }));
    return `<div class="stack">${parts.map((p) => (p.n ? `<span title="${esc(p.label)}: ${p.n}" style="width:${(p.n / fams.length) * 100}%;background:${p.colour}"></span>` : '')).join('')}</div>
      <div class="legend">${parts.map((p) => `<span><i style="background:${p.colour}"></i>${esc(p.label)}: ${fmt.format(p.n)}</span>`).join('')}</div>`;
  }

  function tagBars(paths, s) {
    return `<table><tbody>${paths.map((p) => `<tr><td style="width:38%"><code>${esc(leaf(p))}</code>${s.descriptions[p] ? ` <span class="small muted">${esc(s.descriptions[p])}</span>` : ''}</td><td><div class="hbar"><div class="bar"><span style="width:${s.share(p) * 100}%"></span></div><span class="num small" style="width:44px">${pct(s.share(p))}</span></div></td><td class="num small">${fmt.format(Math.round(s.share(p) * s.taggedCount))} families</td></tr>`).join('')}</tbody></table>`;
  }

  // ---------------------------------------------------------------------------
  // Documents: open, print, download
  // ---------------------------------------------------------------------------
  function docNames() {
    return state.docFor.split('|').map((n) => n.trim()).filter(Boolean).slice(0, MAX_PROPOSAL_FAMILIES);
  }

  function renderDoc() {
    const open = !!(state.doc && state.model);
    $('#doc-view').classList.toggle('hidden', !open);
    $('#app-main').classList.toggle('hidden', open);
    if (!open) {
      if (state.renderedDoc) document.title = 'Untagger · Google Fonts tag coverage';
      state.renderedDoc = '';
      return;
    }
    const key = `${state.doc}|${state.docFor}|${state.meta.fetchedAt}`;
    if (key === state.renderedDoc) return;
    state.renderedDoc = key;
    docFonts = new Map();
    let html, title;
    try {
      if (state.doc === 'report') {
        html = severityDoc();
        title = 'Severity report';
      } else {
        const names = docNames();
        html = proposalDoc(names);
        title = names.length === 1 ? `Proposal: ${names[0]}` : `Proposals for ${names.length} families`;
      }
    } catch (err) {
      console.error(err);
      html = `<h1>Couldn't build this document</h1><p>${esc(err.message)}</p>`;
      title = 'Error';
    }
    $('#doc').innerHTML = html;
    $('#doc-title').textContent = title;
    document.title = `${title} · Untagger`;
    $('#doc-copy').classList.toggle('hidden', state.doc !== 'proposal');
    loadDocFonts();
    window.scrollTo(0, 0);
  }

  function openDoc(doc, names = []) {
    Object.assign(state, { doc, docFor: names.slice(0, MAX_PROPOSAL_FAMILIES).join('|') });
    render(true);
  }

  function closeDoc() {
    if (history.state && history.state.fromApp) { history.back(); return; }
    Object.assign(state, { doc: '', docFor: '' });
    render();
  }

  function docFileName(ext) {
    const stamp = new Date().toISOString().slice(0, 10);
    if (state.doc === 'report') return `untagger-severity-report-${stamp}.${ext}`;
    const names = docNames();
    return `untagger-proposal-${names.length === 1 ? slug(names[0]) : names.length + '-families'}-${stamp}.${ext}`;
  }

  async function downloadDoc() {
    await docFontsReady;
    const title = $('#doc-title').textContent;
    const links = docFontHrefs.map((h) => `<link rel="stylesheet" href="${esc(h)}">`).join('\n');
    const html = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(title)} · Untagger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
${links}
<style>body{margin:0;background:#f4f4f5;padding:24px 8px}${DOC_CSS}</style>
</head>
<body>
${$('#doc').outerHTML}
</body>
</html>
`;
    download(docFileName('html'), 'text/html;charset=utf-8', html);
  }

  async function printDoc() {
    toast('Loading fonts for printing…');
    await docFontsReady;
    await document.fonts.ready;
    window.print();
  }

  // ---------------------------------------------------------------------------
  // Banner / toast
  // ---------------------------------------------------------------------------
  function hideBanner() { const b = $('#banner'); b.classList.add('hidden'); b.innerHTML = ''; }

  function showError(title, failures) {
    const b = $('#banner');
    const detail = failures.map((f) => `
      <div class="mt-2"><span class="font-medium">${esc(f.what)}</span>
        <ul class="mt-0.5 list-disc pl-5 font-mono text-[11px] opacity-80">${f.details.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>
      </div>`).join('');
    b.innerHTML = `
      <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-200">
        <div class="font-semibold">${esc(title)}</div>
        <details class="mt-1"><summary class="cursor-pointer select-none opacity-80">What failed</summary>${detail}</details>
        <p class="mt-3 opacity-90">You can also load the files yourself. Save
          <a class="underline" href="${META_URL}" target="_blank" rel="noopener">the catalog JSON</a> and
          <a class="underline" href="${CSV_URL}" target="_blank" rel="noopener">families.csv</a>, then
          <button type="button" id="pick-files" class="font-semibold underline">choose the files</button>.</p>
      </div>`;
    b.classList.remove('hidden');
    $('#pick-files').addEventListener('click', () => $('#file-input').click());
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.remove('opacity-0', 'translate-y-2');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('opacity-0', 'translate-y-2'), 1800);
  }

  // ---------------------------------------------------------------------------
  // Export
  // ---------------------------------------------------------------------------
  function copySync(text) {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    return ok;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    return copySync(text);
  }

  function download(filename, mime, content) {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const csvCell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const statusOf = (f) => (!f.tagged ? 'untagged' : f.expected === 100 ? 'fully tagged' : 'partly tagged');

  function exportRecord(f) {
    const p = f.parts;
    return {
      family: f.name,
      category: f.category,
      taggerPct: Number(f.tagger.toFixed(2)),
      taggerTags: f.taggerCount,
      expectedPct: f.expected,
      status: statusOf(f),
      severity: f.severity ? SEVERITY[f.severity].key : null,
      gaps: f.issues.map((i) => ({ type: i.key, label: i.label, detail: i.why })),
      missingQualityTags: p ? p.qMissing : [],
      expressiveScored: p ? p.eCount : 0,
      qualityScored: p ? `${p.qHave}/${p.qTotal}` : '',
      classificationTags: p ? p.classification : [],
      expressiveNotScored: p ? p.notScored : [],
      tags: Object.fromEntries(f.tags.map((t) => [t.path, t.vf ? { score: t.score, variable: true } : t.score])),
      dateAdded: f.added,
      specimenUrl: specimenUrl(f.name),
    };
  }

  async function doExport(kind) {
    const rows = currentRows();
    if (!rows.length) return;
    const stamp = new Date().toISOString().slice(0, 10);
    const base = `untagger-${state.scope === 'all' ? 'all-families' : state.scope === 'partial' ? 'partly-tagged' : 'untagged'}-${stamp}`;
    const names = rows.map((f) => f.name).join('\n') + '\n';
    const ts = state.model.stats.tagger;

    if (kind === 'copy') {
      toast((await copyText(names)) ? `Copied ${fmt.format(rows.length)} ${rows.length === 1 ? 'name' : 'names'}` : 'Copy failed');
    } else if (kind === 'txt') {
      download(base + '.txt', 'text/plain;charset=utf-8', names);
    } else if (kind === 'csv') {
      const header = ['family', 'category', 'tagger_pct', 'tagger_tags', 'expected_pct', 'status', 'severity', 'gaps', 'missing_quality_tags', 'expressive_scored', 'quality_scored', 'classification_tags', 'date_added', 'specimen_url'];
      const lines = rows.map((f) => {
        const r = exportRecord(f);
        return [r.family, r.category, r.taggerPct, `${r.taggerTags}/${ts.total}`, r.expectedPct, r.status, r.severity || '', r.gaps.map((g) => g.label).join('; '),
          r.missingQualityTags.join('; '), r.expressiveScored, r.qualityScored, r.classificationTags.join('; '), r.dateAdded, r.specimenUrl].map(csvCell).join(',');
      });
      download(base + '.csv', 'text/csv;charset=utf-8', [header.join(','), ...lines].join('\n') + '\n');
    } else if (kind === 'json') {
      const t = state.model.totals;
      const payload = {
        generatedAt: new Date().toISOString(),
        dataFetchedAt: state.meta ? new Date(state.meta.fetchedAt).toISOString() : null,
        sources: { catalog: META_URL, tags: CSV_URL, taggerTagList: ts.source || 'families.csv' },
        view: { show: state.scope, measure: state.measure, search: state.query || null, category: state.category || null, gaps: state.issue || null, taggerPct: state.tpct || null, expectedPct: state.epct || null, sort: state.sort },
        totals: { catalog: t.catalog, tagged: t.tagged, fullyTaggedExpected: t.expectedFull, partlyTagged: t.partial, untagged: t.untagged, taggerTagCount: ts.total, taggerCompletenessPct: Number(ts.completeness.toFixed(3)) },
        count: rows.length,
        families: rows.map(exportRecord),
      };
      download(base + '.json', 'application/json', JSON.stringify(payload, null, 2) + '\n');
    }
  }

  // ---------------------------------------------------------------------------
  // Refresh cooldown
  // ---------------------------------------------------------------------------
  const cooldownLeft = () => Math.max(0, (Number(store.get(COOLDOWN_KEY)) || 0) + COOLDOWN_MS - Date.now());

  function tickCooldown() {
    const left = cooldownLeft();
    const btn = $('#refresh');
    btn.disabled = left > 0 || state.loading;
    $('#refresh-label').textContent = state.loading ? 'Loading…' : left > 0 ? (state.refreshFailed ? 'Failed' : 'Updated') : 'Refresh';
    btn.title = 'Fetch fresh data, ignoring the 24 h cache';
  }
  setInterval(tickCooldown, 500);

  // ---------------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------------
  function update(changes) {
    Object.assign(state, changes, { limit: PAGE_SIZE });
    render();
  }

  $('#refresh').addEventListener('click', async () => {
    if (cooldownLeft() > 0 || state.loading) return;
    store.set(COOLDOWN_KEY, String(Date.now()));
    tickCooldown();
    state.refreshFailed = !(await load({ fresh: true }));
    store.set(COOLDOWN_KEY, String(Date.now()));
    tickCooldown();
  });

  $('#theme').addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark');
    store.set('gfu:theme', dark ? 'dark' : 'light');
  });

  document.querySelectorAll('[data-scope]').forEach((btn) =>
    btn.addEventListener('click', () => update({ scope: btn.dataset.scope })));
  document.querySelectorAll('button[data-view]').forEach((btn) =>
    btn.addEventListener('click', () => update({ view: btn.dataset.view })));
  document.querySelectorAll('button[data-measure]').forEach((btn) =>
    btn.addEventListener('click', () => update({ measure: btn.dataset.measure })));

  let searchTimer;
  $('#search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => update({ query: e.target.value }), 120);
  });
  $('#category').addEventListener('change', (e) => update({ category: e.target.value }));
  $('#issue').addEventListener('change', (e) => update({ issue: e.target.value }));
  $('#tpct').addEventListener('change', (e) => update({ tpct: e.target.value }));
  $('#epct').addEventListener('change', (e) => update({ epct: e.target.value }));
  $('#sort').addEventListener('change', (e) => update({ sort: e.target.value }));
  $('#reset').addEventListener('click', () => update({ query: '', category: '', issue: '', tpct: '', epct: '' }));
  $('#sample').addEventListener('input', (e) => {
    state.sample = e.target.value;
    document.querySelectorAll('#list .preview').forEach((p) => {
      p.textContent = state.sample || p.closest('li').dataset.name;
    });
  });

  document.querySelectorAll('.export-btn[data-export]').forEach((btn) =>
    btn.addEventListener('click', () => doExport(btn.dataset.export)));

  $('#open-report').addEventListener('click', () => state.model && openDoc('report'));
  $('#propose-list').addEventListener('click', () => {
    const rows = currentRows();
    if (rows.length) openDoc('proposal', rows.slice(0, MAX_PROPOSAL_FAMILIES).map((f) => f.name));
  });
  $('#doc-back').addEventListener('click', closeDoc);
  // In-document links ("#prop-…") would otherwise replace the app's hash state.
  $('#doc').addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#prop-"]');
    if (!a) return;
    e.preventDefault();
    const target = document.getElementById(a.getAttribute('href').slice(1));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('#doc-print').addEventListener('click', printDoc);
  $('#doc-download').addEventListener('click', downloadDoc);
  $('#doc-copy').addEventListener('click', async () => {
    const rows = [...$('#doc').querySelectorAll('section.fam pre')].map((pre) => pre.textContent.trim()).filter(Boolean).join('\n');
    toast(rows && (await copyText(rows + '\n')) ? `Copied ${plural(rows.split('\n').length, 'row')}` : 'Nothing to copy');
  });

  $('#list').addEventListener('click', (e) => {
    const more = e.target.closest('#more');
    if (more) {
      state.limit += PAGE_SIZE;
      renderList();
      return;
    }

    const proposeBtn = e.target.closest('[data-propose]');
    if (proposeBtn) {
      openDoc('proposal', [proposeBtn.dataset.propose]);
      return;
    }

    const expand = e.target.closest('[data-expand]');
    if (expand) {
      const li = expand.closest('li');
      const panel = li.querySelector('.tag-panel');
      if (!panel.innerHTML) panel.innerHTML = tagPanelHtml(state.model.byName.get(li.dataset.name));
      const open = panel.classList.toggle('hidden') === false;
      expand.setAttribute('aria-expanded', String(open));
      expand.querySelector('svg').classList.toggle('rotate-180', open);
      return;
    }

    const tag = e.target.closest('[data-tag]');
    if (tag) {
      update({ query: tag.dataset.tag, scope: 'all', issue: '', tpct: '', epct: '' });
      $('#list').scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast(tag.dataset.tag.startsWith('!') ? `Families without ${tag.dataset.tag.slice(1)}` : `Families tagged ${tag.dataset.tag}`);
      return;
    }

    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    const name = btn.dataset.copy;
    if ('tagger' in btn.dataset) {
      // Copy synchronously, before the link opens the tagger and this page loses focus.
      toast(copySync(name) ? `Copied “${name}”. Paste it into the tagger` : 'Copy failed');
      return;
    }
    copyText(name).then((ok) => toast(ok ? `Copied “${name}”` : 'Copy failed'));
  });

  $('#file-input').addEventListener('change', (e) => {
    if (e.target.files.length) loadFiles([...e.target.files]);
    e.target.value = '';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !state.doc && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      $('#search').focus();
    }
  });

  const onNavigate = () => { readUrl(); state.limit = PAGE_SIZE; render(); };
  window.addEventListener('hashchange', onNavigate);
  window.addEventListener('popstate', onNavigate);

  // Keep the "fetched N min ago" line current.
  setInterval(renderStatus, 60 * 1000);

  readUrl();
  tickCooldown();
  render();
  load();
})();
</script>
</body>
</html>
