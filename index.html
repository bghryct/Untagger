<script>
  // Apply the saved/system theme before first paint to avoid a flash.
  (function () {
    try {
      var saved = localStorage.getItem('gfu:theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------------
  const META_URL = 'https://fonts.google.com/metadata/fonts';
  const CSV_URL = 'https://raw.githubusercontent.com/google/fonts/main/tags/all/families.csv';
  const TAGGER_URL = 'https://googlefonts.github.io/tagger/';

  const proxied = (url) => [
    { label: 'allorigins.win proxy', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url) },
    { label: 'corsproxy.io proxy', url: 'https://corsproxy.io/?' + encodeURIComponent(url) },
  ];

  // Tried in order until one returns parseable data.
  const CATALOG_SOURCES = [
    { label: 'fonts.google.com', url: META_URL },
    // Same JSON, copied daily by the GF Tagger's own GitHub workflows and served with CORS.
    { label: 'GF Tagger copy', url: 'https://googlefonts.github.io/tagger/family_data.json' },
    { label: 'google.github.io copy', url: 'https://google.github.io/fonts/family_data.json' },
    ...proxied(META_URL),
  ];
  const TAG_SOURCES = [
    { label: 'raw.githubusercontent.com', url: CSV_URL },
    { label: 'GitHub API', url: 'https://api.github.com/repos/google/fonts/contents/tags/all/families.csv?ref=main', headers: { Accept: 'application/vnd.github.raw' } },
    ...proxied(CSV_URL),
  ];
  // The GF Tagger's own list of tags; its completeness counts against these.
  const TAGGER_LIST_SOURCES = [
    { label: 'GF Tagger', url: 'https://googlefonts.github.io/tagger/tags_metadata.csv' },
    { label: 'googlefonts/tagger on GitHub', url: 'https://raw.githubusercontent.com/googlefonts/tagger/main/public/tags_metadata.csv' },
  ];
  const TAGGER_DEFS_SOURCES = [
    { label: 'GF Tagger', url: 'https://googlefonts.github.io/tagger/tag_definitions.json' },
    { label: 'googlefonts/tagger on GitHub', url: 'https://raw.githubusercontent.com/googlefonts/tagger/main/public/tag_definitions.json' },
  ];

  const CACHE_KEY = 'gfu:data:v4';
  const CACHE_TTL_MS = 24 * 60 * 60 * 1000;
  const COOLDOWN_KEY = 'gfu:lastRefresh';
  const COOLDOWN_MS = 30 * 1000;
  const FETCH_TIMEOUT_MS = 15 * 1000;
  const PAGE_SIZE = 100;

  // Expected-measure rules (see the "How the percentages work" panel).
  const THIN_EXPRESSIVE = 3;            // this many Expressive tags or fewer is flagged
  const EXPECTED_TAG_SHARE = 0.9;       // a Quality tag is expected if 90%+ of tagged families have it

  const CATEGORIES = ['Sans Serif', 'Serif', 'Display', 'Handwriting', 'Monospace'];
  const CLASSIFICATION_GROUPS = ['Sans', 'Serif', 'Slab', 'Script', 'Theme', 'Monospace', 'Special use', 'Not text'];
  const ANY_CLASSIFICATION = { groups: CLASSIFICATION_GROUPS, label: 'classification' };
  const EXPECTED_CLASSIFICATION = {
    'Sans Serif': { groups: ['Sans'], label: '/Sans' },
    'Serif': { groups: ['Serif', 'Slab'], label: '/Serif or /Slab' },
    'Handwriting': { groups: ['Script'], label: '/Script' },
    'Monospace': { groups: ['Monospace'], label: '/Monospace' },
  };
  const expectedFor = (category) => EXPECTED_CLASSIFICATION[category] || ANY_CLASSIFICATION;

  const SCOPES = {
    all: { noun: 'families', test: () => true },
    partial: { noun: 'partly tagged', test: (f) => f.tagged && f.expected < 100 },
    untagged: { noun: 'untagged', test: (f) => !f.tagged },
  };
  const ISSUE_FILTERS = [
    { v: '', label: 'Any gaps', test: () => true },
    { v: 'flagged', label: 'Has flagged gaps', test: (f) => f.issues.length > 0 },
    { v: 'quality', label: 'Quality gap', test: (f) => hasIssue(f, 'quality') },
    { v: 'expressive', label: 'Few Expressive tags', test: (f) => hasIssue(f, 'expressive') },
    { v: 'classification', label: 'No classification tag', test: (f) => hasIssue(f, 'classification') },
    { v: 'clean', label: 'No flagged gaps', test: (f) => f.issues.length === 0 },
  ];
  const TAGGER_PCT_FILTERS = [
    { v: '', label: 'Tagger %: any', test: () => true },
    { v: '0', label: 'Tagger 0%', test: (p) => p === 0 },
    { v: 'lt10', label: 'Tagger under 10%', test: (p) => p > 0 && p < 10 },
    { v: '10-15', label: 'Tagger 10–15%', test: (p) => p >= 10 && p < 15 },
    { v: '15-20', label: 'Tagger 15–20%', test: (p) => p >= 15 && p < 20 },
    { v: '20-25', label: 'Tagger 20–25%', test: (p) => p >= 20 && p < 25 },
    { v: '25+', label: 'Tagger 25% or more', test: (p) => p >= 25 },
  ];
  const EXPECTED_PCT_FILTERS = [
    { v: '', label: 'Expected %: any', test: () => true },
    { v: '0', label: 'Expected 0%', test: (p) => p === 0 },
    { v: '1-49', label: 'Expected 1–49%', test: (p) => p >= 1 && p <= 49 },
    { v: '50-79', label: 'Expected 50–79%', test: (p) => p >= 50 && p <= 79 },
    { v: '80-99', label: 'Expected 80–99%', test: (p) => p >= 80 && p <= 99 },
    { v: '100', label: 'Expected 100%', test: (p) => p === 100 },
  ];
  const hasIssue = (f, key) => f.issues.some((i) => i.key === key);

  // ---------------------------------------------------------------------------
  // Small helpers
  // ---------------------------------------------------------------------------
  const $ = (sel) => document.querySelector(sel);
  const fmt = new Intl.NumberFormat();
  const pct = (x) => (x >= 0.995 && x < 1 ? (x * 100).toFixed(1) : Math.round(x * 100)) + '%';
  const taggerPct = (p) => (p === 0 ? '0%' : p.toFixed(1) + '%');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const groupOf = (path) => path.split('/')[1] || '';
  const leaf = (path) => path.split('/').pop();
  const trimSlash = (path) => path.replace(/^\//, '');

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } },
  };

  const specimenUrl = (name) => 'https://fonts.google.com/specimen/' + encodeURIComponent(name).replace(/%20/g, '+');

  function relativeTime(ts) {
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 45) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + ' h ago';
    return Math.round(h / 24) + ' d ago';
  }

  // ---------------------------------------------------------------------------
  // Fetching
  // ---------------------------------------------------------------------------
  async function fetchText(source, fresh) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(source.url, {
        signal: ctrl.signal,
        cache: fresh ? 'no-cache' : 'default',
        headers: source.headers || { Accept: 'application/json, text/csv, text/plain, */*' },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } finally {
      clearTimeout(timer);
    }
  }

  async function firstWorking(sources, parse, fresh) {
    const errors = [];
    for (const source of sources) {
      try {
        return { data: parse(await fetchText(source, fresh)), source: source.label };
      } catch (err) {
        const reason = err.name === 'AbortError' ? 'timed out'
          : err instanceof TypeError ? 'blocked (CORS) or offline'
          : err.message;
        errors.push(source.label + ': ' + reason);
      }
    }
    const e = new Error('All sources failed');
    e.details = errors;
    throw e;
  }

  // The tagger's tag set is tag_definitions.json keys plus every name in tags_metadata.csv.
  // Optional: without it the tagger measure falls back to the tags found in families.csv.
  async function fetchTaggerTags(fresh) {
    const [list, defs] = await Promise.allSettled([
      firstWorking(TAGGER_LIST_SOURCES, parseTaggerList, fresh),
      firstWorking(TAGGER_DEFS_SOURCES, (text) => Object.keys(JSON.parse(text)), fresh),
    ]);
    if (list.status !== 'fulfilled') return null;
    const names = new Set(list.value.data);
    if (defs.status === 'fulfilled') defs.value.data.forEach((n) => names.add(n));
    return { names: [...names].sort(), source: list.value.source };
  }

  // ---------------------------------------------------------------------------
  // Parsing
  // ---------------------------------------------------------------------------
  function parseCatalog(text) {
    let raw = text.replace(/^\uFEFF/, '').trimStart();
    if (raw.startsWith(")]}'")) raw = raw.slice(4); // XSSI guard prefix
    const list = JSON.parse(raw).familyMetadataList;
    if (!Array.isArray(list) || list.length < 100) throw new Error('unexpected catalog format');
    return list.filter((f) => f && f.family).map((f) => ({
      name: f.family,
      category: f.category || '',
      added: f.dateAdded || '',
      popularity: typeof f.popularity === 'number' ? f.popularity : null,
      latin: Array.isArray(f.subsets) ? f.subsets.includes('latin') : true,
      preview: previewSpec(f.family, Object.keys(f.fonts || {})),
    }));
  }

  // css2 requests fail for families without a regular 400, so pick a style that exists.
  function previewSpec(name, fontKeys) {
    const family = encodeURIComponent(name).replace(/%20/g, '+');
    const closest = (ws) => ws.reduce((a, b) => (Math.abs(b - 400) < Math.abs(a - 400) ? b : a));
    const upright = fontKeys.filter((k) => !k.endsWith('i')).map(Number).filter(Boolean);
    const italic = fontKeys.filter((k) => k.endsWith('i')).map((k) => parseInt(k, 10)).filter(Boolean);
    if (upright.length === 0 && italic.length > 0) {
      const w = closest(italic);
      return { q: `${family}:ital,wght@1,${w}`, weight: w, italic: true };
    }
    if (upright.length === 0 || upright.includes(400)) return { q: family, weight: 400, italic: false };
    const w = closest(upright);
    return { q: `${family}:wght@${w}`, weight: w, italic: false };
  }

  // Minimal RFC 4180 parser (axis columns are quoted and contain commas).
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
        } else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Compact, cacheable form: { vocab: [tagPath], fam: { lowercased family: [[vocabIndex, score, isVariable, taggerCount]] } }.
  // Variable-font tags have one row per axis position; they collapse to a "min–max" score.
  // taggerCount mirrors the GF Tagger: each static row is one tagging, and all of a tag's
  // variable rows ("…@…" axis positions) together are one.
  function parseTags(text) {
    const vocabIndex = new Map();
    const acc = new Map();
    for (const r of parseCSV(text)) {
      const family = (r[0] || '').trim();
      const path = (r[2] || '').trim();
      if (!family || !path.startsWith('/') || family.toLowerCase() === 'family') continue;
      if (!vocabIndex.has(path)) vocabIndex.set(path, vocabIndex.size);
      const key = family.toLowerCase();
      if (!acc.has(key)) acc.set(key, new Map());
      const tags = acc.get(key);
      if (!tags.has(path)) tags.set(path, { scores: [], vf: false, staticRows: 0 });
      const t = tags.get(path);
      const score = parseFloat(r[3]);
      if (!Number.isNaN(score)) t.scores.push(score);
      if ((r[1] || '').includes('@')) t.vf = true;
      else t.staticRows++;
    }
    if (acc.size < 100) throw new Error('unexpected tags format');
    const fam = {};
    for (const [key, tags] of acc) {
      fam[key] = [...tags].map(([path, t]) => {
        const lo = Math.min(...t.scores), hi = Math.max(...t.scores);
        const score = !t.scores.length ? '' : lo === hi ? String(lo) : `${lo}–${hi}`;
        return [vocabIndex.get(path), score, t.vf ? 1 : 0, t.staticRows + (t.vf ? 1 : 0)];
      });
    }
    return { vocab: [...vocabIndex.keys()], fam };
  }

  function parseTaggerList(text) {
    const names = text.split('\n').map((l) => l.trim()).filter((l) => l && !l.startsWith('#')).map((l) => l.split(',')[0]);
    if (names.filter((n) => n.startsWith('/')).length < 20) throw new Error('unexpected tag list format');
    return names;
  }

  // ---------------------------------------------------------------------------
  // Model: both measures, flagged gaps, and the stats behind them
  // ---------------------------------------------------------------------------
  function buildModel(catalog, tagData, taggerTags) {
    const { vocab, fam } = tagData;
    const families = catalog.map((c) => {
      const tags = (fam[c.name.toLowerCase()] || []).map(([i, score, vf, n]) =>
        ({ path: vocab[i], group: groupOf(vocab[i]), score, vf: !!vf, n: n ?? 1 }));
      return { ...c, nameLower: c.name.toLowerCase(), tagged: tags.length > 0, tags, tagPathsLower: tags.map((t) => t.path.toLowerCase()) };
    });
    const tagged = families.filter((f) => f.tagged);
    const n = Math.max(tagged.length, 1);

    // Tagger measure: taggings of known tags ÷ all tags except /quant/ (as in the tagger's Todo panel).
    const taggerKnown = new Set(taggerTags ? taggerTags.names : vocab);
    const taggerCounted = [...taggerKnown].filter((name) => !name.startsWith('/quant/'));
    const taggerTotal = Math.max(taggerCounted.length, 1);
    let taggings = 0;
    for (const f of families) {
      f.taggerCount = f.tags.reduce((sum, t) => sum + (taggerKnown.has(t.path) ? t.n : 0), 0);
      f.tagger = (f.taggerCount / taggerTotal) * 100;
      taggings += f.taggerCount;
    }

    // How common each tag is across tagged families.
    const freq = new Map();
    tagged.forEach((f) => f.tags.forEach((t) => freq.set(t.path, (freq.get(t.path) || 0) + 1)));
    const share = (path) => (freq.get(path) || 0) / n;
    const byShare = (a, b) => share(b) - share(a) || a.localeCompare(b);
    const expressiveVocab = vocab.filter((p) => groupOf(p) === 'Expressive').sort(byShare);
    const qualityExpected = vocab.filter((p) => groupOf(p) === 'Quality' && share(p) >= EXPECTED_TAG_SHARE).sort();

    const isSpecial = (f) => f.tags.some((t) => t.group === 'Special use');
    const expressiveCount = (f) => f.tags.filter((t) => t.group === 'Expressive').length;
    const hasExpected = (f) => f.tags.some((t) => expectedFor(f.category).groups.includes(t.group));
    const quantile = (sorted, q) => (sorted.length ? sorted[Math.floor((sorted.length - 1) * q)] : 0);
    const eCounts = tagged.map(expressiveCount).sort((a, b) => a - b);
    const taggerSorted = tagged.map((f) => f.tagger).sort((a, b) => a - b);

    const stats = {
      share,
      taggedCount: tagged.length,
      tagger: {
        total: taggerTotal,
        source: taggerTags ? taggerTags.source : null,
        completeness: (taggings / (Math.max(families.length, 1) * taggerTotal)) * 100,
        p10: quantile(taggerSorted, 0.1),
        median: quantile(taggerSorted, 0.5),
        p90: quantile(taggerSorted, 0.9),
        max: taggerSorted[taggerSorted.length - 1] || 0,
      },
      expressiveTotal: expressiveVocab.length,
      expressiveTarget: Math.max(1, quantile(eCounts, 0.25)), // reached by 3 in 4 tagged families
      expressiveMedian: quantile(eCounts, 0.5),
      qualityExpected,
      qualityFullShare: tagged.filter((f) => qualityExpected.every((p) => f.tags.some((t) => t.path === p))).length / n,
      classificationShare: {},
    };
    const classificationShare = (category) => {
      if (!(category in stats.classificationShare)) {
        const pool = tagged.filter((f) => f.category === category && !isSpecial(f));
        stats.classificationShare[category] = pool.length ? pool.filter(hasExpected).length / pool.length : 0;
      }
      return stats.classificationShare[category];
    };
    CATEGORIES.forEach(classificationShare);

    for (const f of families) {
      f.issues = [];
      f.notInTagger = f.tags.filter((t) => !taggerKnown.has(t.path)).map((t) => t.path);
      if (!f.tagged) {
        f.expected = 0;
        f.parts = null;
        f.issues.push({ key: 'untagged', label: 'Untagged', why: 'No rows in families.csv yet.' });
        continue;
      }
      const have = new Set(f.tags.map((t) => t.path));
      const special = isSpecial(f);
      const eCount = expressiveCount(f);
      const qMissing = qualityExpected.filter((p) => !have.has(p));
      const expected = expectedFor(f.category);
      const classified = special || hasExpected(f);

      const e = special ? 1 : Math.min(eCount / stats.expressiveTarget, 1);
      const q = qualityExpected.length ? 1 - qMissing.length / qualityExpected.length : 1;
      const c = classified ? 1 : 0;
      f.expected = e === 1 && q === 1 && c === 1 ? 100 : Math.min(99, Math.round(((e + q + c) / 3) * 100));
      f.parts = {
        special, eCount, qMissing,
        qHave: qualityExpected.length - qMissing.length,
        qTotal: qualityExpected.length,
        classification: f.tags.filter((t) => CLASSIFICATION_GROUPS.includes(t.group)).map((t) => t.path).sort(),
        expected, classified,
        notScored: expressiveVocab.filter((p) => !have.has(p)),
      };

      if (qMissing.length) {
        f.issues.push({
          key: 'quality',
          label: qMissing.length === qualityExpected.length ? 'No /Quality tags'
            : qMissing.length === 1 ? `Missing ${qMissing[0]}` : `Missing ${qMissing.length} /Quality tags`,
          why: `Missing ${qMissing.join(', ')}. ${pct(stats.qualityFullShare)} of tagged families have all ${qualityExpected.length}.`,
        });
      }
      if (!special && eCount <= THIN_EXPRESSIVE) {
        f.issues.push({
          key: 'expressive',
          label: eCount === 0 ? 'No /Expressive tags' : `Only ${eCount} /Expressive tag${eCount === 1 ? '' : 's'}`,
          why: `3 in 4 tagged families have ${stats.expressiveTarget} or more (median ${stats.expressiveMedian}).`,
        });
      }
      if (!classified) {
        const s = classificationShare(f.category);
        f.issues.push({
          key: 'classification',
          label: expected === ANY_CLASSIFICATION ? 'No classification tag' : `No ${expected.label} tag`,
          why: expected === ANY_CLASSIFICATION
            ? `No tag under /Sans, /Serif, /Slab, /Script, /Theme, /Monospace or /Special use. ${pct(s)} of tagged ${f.category || 'uncategorized'} families have one.`
            : `${pct(s)} of tagged ${f.category} families have a ${expected.label} tag.`,
        });
      }
    }

    return {
      families,
      byName: new Map(families.map((f) => [f.name, f])),
      expressiveVocab,
      stats,
      totals: {
        catalog: families.length,
        tagged: tagged.length,
        expectedFull: tagged.filter((f) => f.expected === 100).length,
        expectedAvg: families.reduce((s, f) => s + f.expected, 0) / Math.max(families.length, 1),
        partial: families.filter(SCOPES.partial.test).length,
        flagged: tagged.filter((f) => f.issues.length).length,
        untagged: families.length - tagged.length,
      },
    };
  }

  // ---------------------------------------------------------------------------
  // State (mirrored into the URL hash so filtered views can be shared)
  // ---------------------------------------------------------------------------
  const DEFAULTS = { scope: 'all', measure: 'tagger', query: '', category: '', issue: '', tpct: '', epct: '', sort: 'least', view: 'previews' };
  const URL_KEYS = { scope: 'show', measure: 'measure', query: 'q', category: 'cat', issue: 'gap', tpct: 'tagger', epct: 'expected', sort: 'sort', view: 'layout' };
  const VALID = {
    scope: (v) => v in SCOPES,
    measure: (v) => v === 'tagger' || v === 'expected',
    query: () => true,
    category: (v) => v === '' || CATEGORIES.includes(v),
    issue: (v) => ISSUE_FILTERS.some((o) => o.v === v),
    tpct: (v) => TAGGER_PCT_FILTERS.some((o) => o.v === v),
    epct: (v) => EXPECTED_PCT_FILTERS.some((o) => o.v === v),
    sort: (v) => v in SORTERS,
    view: (v) => v === 'previews' || v === 'compact',
  };

  const state = {
    ...DEFAULTS,
    sample: $('#sample').value,
    limit: PAGE_SIZE,
    model: null,
    meta: null,          // { fetchedAt, catalogSource, tagSource, fromCache }
    loading: false,
    // Partial results kept so a manual file can fill in whichever fetch failed.
    lastCatalog: null,
    lastTags: null,
    lastTaggerTags: null,
  };

  function readUrl() {
    const params = new URLSearchParams(location.hash.slice(1));
    for (const [key, param] of Object.entries(URL_KEYS)) {
      const v = params.get(param);
      state[key] = v !== null && VALID[key](v) ? v : DEFAULTS[key];
    }
  }

  function writeUrl() {
    const params = new URLSearchParams();
    for (const [key, param] of Object.entries(URL_KEYS)) if (state[key] !== DEFAULTS[key]) params.set(param, state[key]);
    const hash = params.toString();
    history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
  }

  // ---------------------------------------------------------------------------
  // Loading
  // ---------------------------------------------------------------------------
  function readCache() {
    try {
      const c = JSON.parse(store.get(CACHE_KEY));
      if (c && Array.isArray(c.catalog) && c.tags && c.tags.fam) return c;
    } catch (e) {}
    return null;
  }

  function saveAndUse(catalog, tags, taggerTags, meta) {
    store.set(CACHE_KEY, JSON.stringify({ ...meta, catalog, tags, taggerTags }));
    useData(catalog, tags, taggerTags, { ...meta, fromCache: false });
  }

  function useData(catalog, tags, taggerTags, meta) {
    state.model = buildModel(catalog, tags, taggerTags);
    state.meta = meta;
    render();
  }

  async function load({ fresh = false } = {}) {
    const cached = readCache();
    if (!fresh && cached && Date.now() - cached.fetchedAt < CACHE_TTL_MS) {
      useData(cached.catalog, cached.tags, cached.taggerTags, { ...cached, fromCache: true });
      return;
    }

    state.loading = true;
    hideBanner();
    render();

    const [cat, tags, taggerTags] = await Promise.allSettled([
      firstWorking(CATALOG_SOURCES, parseCatalog, fresh),
      firstWorking(TAG_SOURCES, parseTags, fresh),
      fetchTaggerTags(fresh),
    ]);
    state.loading = false;

    if (cat.status === 'fulfilled') state.lastCatalog = cat.value;
    if (tags.status === 'fulfilled') state.lastTags = tags.value;
    // Fall back to the last good tag list (or the cache's) rather than to families.csv's tags.
    const tagList = (taggerTags.status === 'fulfilled' && taggerTags.value) || state.lastTaggerTags || (cached && cached.taggerTags) || null;
    state.lastTaggerTags = tagList;

    if (cat.status === 'fulfilled' && tags.status === 'fulfilled') {
      saveAndUse(cat.value.data, tags.value.data, tagList,
        { fetchedAt: Date.now(), catalogSource: cat.value.source, tagSource: tags.value.source });
      return;
    }

    const failures = [];
    if (cat.status === 'rejected') failures.push({ what: 'Catalog (fonts.google.com/metadata/fonts)', details: cat.reason.details || [cat.reason.message] });
    if (tags.status === 'rejected') failures.push({ what: 'Tags (families.csv)', details: tags.reason.details || [tags.reason.message] });

    if (cached) {
      useData(cached.catalog, cached.tags, cached.taggerTags, { ...cached, fromCache: true });
      showError(`Couldn't refresh, so this is cached data from ${relativeTime(cached.fetchedAt)}.`, failures);
    } else if (state.model) {
      render();
      showError(`Couldn't refresh, so this is data from ${relativeTime(state.meta.fetchedAt)}.`, failures);
    } else {
      render();
      showError("Couldn't load the data.", failures);
    }
  }

  // Manual fallback: user picks the files they downloaded themselves.
  async function loadFiles(files) {
    for (const file of files) {
      const text = await file.text();
      const head = text.replace(/^\uFEFF/, '').trimStart().slice(0, 4);
      try {
        if (head.startsWith('{') || head === ")]}'") state.lastCatalog = { data: parseCatalog(text), source: 'local file (' + file.name + ')' };
        else state.lastTags = { data: parseTags(text), source: 'local file (' + file.name + ')' };
      } catch (err) {
        toast(`Couldn't read ${file.name}: ${err.message}`);
        return;
      }
    }
    if (state.lastCatalog && state.lastTags) {
      hideBanner();
      saveAndUse(state.lastCatalog.data, state.lastTags.data, state.lastTaggerTags,
        { fetchedAt: Date.now(), catalogSource: state.lastCatalog.source, tagSource: state.lastTags.source });
    } else {
      toast(state.lastCatalog ? 'Catalog loaded. Now add families.csv' : 'Tags loaded. Now add the catalog JSON');
    }
  }

  // ---------------------------------------------------------------------------
  // Filtering & sorting
  // ---------------------------------------------------------------------------
  const measureOf = (f) => (state.measure === 'tagger' ? f.tagger : f.expected);
  const otherMeasureOf = (f) => (state.measure === 'tagger' ? f.expected : f.tagger);

  function queryTest(raw) {
    const s = raw.trim().toLowerCase();
    if (!s) return () => true;
    const negate = s.startsWith('!/') || s.startsWith('-/');
    const tag = negate ? s.slice(1) : s;
    if (tag.startsWith('/')) return (f) => f.tagPathsLower.some((p) => p.includes(tag)) !== negate;
    return (f) => f.nameLower.includes(s);
  }

  // `skip` leaves one filter out, so each dropdown can show counts for its own options.
  function filtered(skip) {
    const q = queryTest(state.query);
    // Gap and percentage filters are hidden for untagged families (no tags, 0%), so ignore them there.
    const untaggedOnly = state.scope === 'untagged';
    const pick = (list, v) => (untaggedOnly ? list[0] : list.find((o) => o.v === v));
    const issue = pick(ISSUE_FILTERS, state.issue);
    const tpct = pick(TAGGER_PCT_FILTERS, state.tpct);
    const epct = pick(EXPECTED_PCT_FILTERS, state.epct);
    return state.model.families.filter((f) =>
      SCOPES[state.scope].test(f) &&
      (skip === 'category' || !state.category || f.category === state.category) &&
      (skip === 'issue' || issue.test(f)) &&
      (skip === 'tpct' || tpct.test(f.tagger)) &&
      (skip === 'epct' || epct.test(f.expected)) &&
      q(f));
  }

  const byName = (a, b) => a.name.localeCompare(b.name);
  const byNewest = (a, b) => (b.added || '').localeCompare(a.added || '');
  const SORTERS = {
    least: (a, b) => measureOf(a) - measureOf(b) || otherMeasureOf(a) - otherMeasureOf(b) || b.issues.length - a.issues.length || byNewest(a, b) || byName(a, b),
    most: (a, b) => measureOf(b) - measureOf(a) || otherMeasureOf(b) - otherMeasureOf(a) || byName(a, b),
    newest: (a, b) => byNewest(a, b) || byName(a, b),
    name: byName,
    popular: (a, b) => (a.popularity ?? Infinity) - (b.popularity ?? Infinity) || byName(a, b),
  };

  const currentRows = () => (state.model ? filtered().sort(SORTERS[state.sort]) : []);

  // ---------------------------------------------------------------------------
  // View
  // ---------------------------------------------------------------------------
  function render() {
    document.body.dataset.view = state.view;
    document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
    document.querySelectorAll('button[data-measure]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.measure === state.measure)));
    $('#sort').value = state.sort;
    if ($('#search').value !== state.query) $('#search').value = state.query;

    const m = state.model;
    const t = m && m.totals;
    const ts = m && m.stats.tagger;
    const tagger = state.measure === 'tagger';
    $('#m-total').textContent = t ? fmt.format(t.catalog) : '—';
    $('#m-total-sub').textContent = !t ? '\u00a0' : tagger
      ? `${ts.completeness.toFixed(1)}% complete (tagger)` : `${Math.round(t.expectedAvg)}% expected, on average`;
    $('#m-total-sub').title = t ? `The GF Tagger's Todo panel figure: ${ts.completeness.toFixed(3)}% complete` : '';
    $('#m-tagged').textContent = t ? fmt.format(t.tagged) : '—';
    $('#m-tagged-sub').textContent = !t ? '\u00a0' : tagger
      ? `median ${taggerPct(ts.median)} of ${ts.total} tags` : `${fmt.format(t.expectedFull)} at 100% expected`;
    $('#m-partial').textContent = t ? fmt.format(t.partial) : '—';
    $('#m-partial-sub').textContent = t ? `${fmt.format(t.flagged)} with flagged gaps` : '\u00a0';
    $('#m-untagged').textContent = t ? fmt.format(t.untagged) : '—';

    document.querySelectorAll('[data-scope]').forEach((btn) => {
      const scope = btn.dataset.scope;
      btn.setAttribute('aria-selected', String(scope === state.scope));
      btn.querySelector('.scope-count').textContent = m ? fmt.format(m.families.filter(SCOPES[scope].test).length) : '';
    });

    renderFilterOptions();
    renderLegend();
    renderList();
    renderStatus();
    writeUrl();
  }

  function renderFilterOptions() {
    const m = state.model;
    const optionList = (sel, options, current, countFor) => {
      sel.innerHTML = options.map((o) =>
        `<option value="${esc(o.v)}">${esc(o.label)}${m ? ` (${fmt.format(countFor(o))})` : ''}</option>`).join('');
      sel.value = current;
    };
    const catPool = m ? filtered('category') : [];
    optionList($('#category'), [{ v: '', label: 'All categories' }, ...CATEGORIES.map((c) => ({ v: c, label: c }))], state.category,
      (o) => (o.v ? catPool.filter((f) => f.category === o.v).length : catPool.length));
    const issuePool = m ? filtered('issue') : [];
    optionList($('#issue'), ISSUE_FILTERS, state.issue, (o) => issuePool.filter(o.test).length);
    const tPool = m ? filtered('tpct') : [];
    optionList($('#tpct'), TAGGER_PCT_FILTERS, state.tpct, (o) => tPool.filter((f) => o.test(f.tagger)).length);
    const ePool = m ? filtered('epct') : [];
    optionList($('#epct'), EXPECTED_PCT_FILTERS, state.epct, (o) => ePool.filter((f) => o.test(f.expected)).length);

    const untaggedOnly = state.scope === 'untagged';
    ['#issue', '#tpct', '#epct'].forEach((id) => $(id).classList.toggle('hidden', untaggedOnly));
    const active = state.query || state.category || state.issue || state.tpct || state.epct;
    $('#reset').classList.toggle('hidden', !active);
  }

  function renderLegend() {
    const m = state.model;
    if (!m) { $('#legend-body').innerHTML = '<p>Loads with the data.</p>'; return; }
    const s = m.stats;
    const ts = s.tagger;
    const code = (x) => `<span class="code">${esc(x)}</span>`;
    const share = (cat) => pct(s.classificationShare[cat] || 0);
    const b = (x) => `<b class="font-medium text-zinc-800 dark:text-zinc-200">${x}</b>`;
    $('#legend-body').innerHTML = `
      <p>${b('Tagger')} (the default) uses the GF Tagger's own measure: tags scored out of all ${ts.total} tags the tagger tracks (its ${code('/quant')} measurements aren't counted). A variable-font tag counts once, however many axis positions it's scored at. Across the catalog this gives ${b(ts.completeness.toFixed(3) + '%')}, the figure the tagger's Todo panel shows as “Tagging is … complete”. Most tags only suit some fonts (Seasonal, Theme, Script…), so no family gets near 100%: the median is ${taggerPct(ts.median)} and the highest is ${taggerPct(ts.max)}.${ts.source ? '' : ` <span class="text-amber-700 dark:text-amber-300">The tagger's tag list couldn't be loaded, so this uses the ${ts.total} tags found in families.csv instead.</span>`}</p>
      <p>${b('Expected')} averages three parts, so 100% means a family is tagged to the usual standard:</p>
      <ul class="list-disc space-y-1 pl-5">
        <li>${b('Quality')}: how many of the ${s.qualityExpected.length} ${code('/Quality')} tags are scored. ${pct(s.qualityFullShare)} of tagged families have all of them.</li>
        <li>${b('Expressive')}: ${code('/Expressive')} tags scored, out of ${s.expressiveTarget}. Taggers pick these selectively, so nobody is expected to have all ${s.expressiveTotal}; 3 in 4 tagged families have ${s.expressiveTarget} or more (median ${s.expressiveMedian}).</li>
        <li>${b('Classification')}: whether it has a tag in the group its category calls for. Sans Serif → ${code('/Sans')} (${share('Sans Serif')} do), Serif → ${code('/Serif')} or ${code('/Slab')} (${share('Serif')}), Handwriting → ${code('/Script')} (${share('Handwriting')}), Monospace → ${code('/Monospace')} (${share('Monospace')}), Display → any of ${code('/Sans')}, ${code('/Serif')}, ${code('/Slab')}, ${code('/Script')}, ${code('/Theme')}, ${code('/Monospace')}, ${code('/Special use')} (${share('Display')}).</li>
      </ul>
      <p>The ${b('Measure')} switch sets which percentage is shown big and used for “Least/Most tagged” sorting; both can always be filtered. ${b('Partly tagged')} means below 100% on Expected, since on the tagger's measure every family is partly tagged.</p>
      <p>${b('Flagged gaps')} are the likely misses: a missing Quality tag, ${THIN_EXPRESSIVE} or fewer Expressive tags, or no classification tag. Families with a ${code('/Special use')} tag (barcodes, redaction, symbols) get full Expected marks for Expressive and Classification.</p>
      <p>Open a family's ${b('Tags')} panel to see every score and the Expressive tags it hasn't been scored on. Click any tag to list the families that have it, or a dashed one to list the families that don't.</p>`;
  }

  function renderList() {
    const m = state.model;
    const list = $('#list');
    const rows = currentRows();
    document.querySelectorAll('.export-btn').forEach((b) => (b.disabled = !rows.length));

    if (state.loading && !m) {
      $('#count').textContent = 'Loading catalog and tags…';
      list.classList.remove('hidden');
      list.innerHTML = Array.from({ length: 6 }, () => `
        <li class="px-4 py-4 sm:px-5">
          <div class="skeleton h-4 w-40 rounded"></div>
          <div class="skeleton mt-3 h-5 w-2/3 rounded"></div>
        </li>`).join('');
      return;
    }
    if (!m) {
      $('#count').textContent = '';
      list.innerHTML = '';
      list.classList.add('hidden');
      return;
    }
    list.classList.remove('hidden');

    const scopeTotal = m.families.filter(SCOPES[state.scope].test).length;
    const noun = SCOPES[state.scope].noun;
    $('#count').textContent = rows.length === scopeTotal
      ? `${fmt.format(scopeTotal)} ${noun}`
      : `${fmt.format(rows.length)} of ${fmt.format(scopeTotal)} ${noun}`;

    if (!rows.length) {
      const msg = scopeTotal === 0
        ? (state.scope === 'untagged' ? 'Every catalog family has at least one tag.' : 'Nothing here: every tagged family is at 100% expected.')
        : 'No families match these filters.';
      list.innerHTML = `<li class="px-5 py-12 text-center text-sm text-zinc-500 dark:text-zinc-400">${esc(msg)}</li>`;
      return;
    }

    const shown = rows.slice(0, state.limit);
    let html = shown.map(rowHtml).join('');
    if (rows.length > shown.length) {
      const next = Math.min(PAGE_SIZE, rows.length - shown.length);
      html += `<li class="p-3 text-center"><button type="button" id="more" class="btn">Show ${fmt.format(next)} more <span class="text-zinc-400">(${fmt.format(rows.length - shown.length)} left)</span></button></li>`;
    }
    list.innerHTML = html;

    list.querySelectorAll('li[data-name]').forEach((li, i) => {
      const f = shown[i];
      const p = li.querySelector('.preview');
      p.style.fontFamily = `"${f.name.replace(/["\\]/g, '\\$&')}", system-ui, sans-serif`;
      p.style.fontWeight = f.preview.weight;
      p.style.fontStyle = f.preview.italic ? 'italic' : 'normal';
      if (state.view === 'previews') observer.observe(li);
    });
  }

  const TONES = {
    good: { text: 'text-emerald-700 dark:text-emerald-400', bar: 'bg-emerald-500' },
    ok: { text: 'text-zinc-800 dark:text-zinc-200', bar: 'bg-indigo-500' },
    low: { text: 'text-amber-700 dark:text-amber-300', bar: 'bg-amber-500' },
    bad: { text: 'text-rose-700 dark:text-rose-300', bar: 'bg-rose-500' },
  };

  // Tagger %: coloured against the catalog (bottom/top 10%), since nobody nears 100%.
  function tone(f) {
    if (state.measure === 'tagger') {
      const s = state.model.stats.tagger;
      if (f.tagger === 0) return TONES.bad;
      if (f.tagger < s.p10) return TONES.low;
      if (f.tagger >= s.p90) return TONES.good;
      return TONES.ok;
    }
    if (f.expected === 100) return TONES.good;
    if (f.expected >= 80) return TONES.ok;
    if (f.expected >= 50) return TONES.low;
    return TONES.bad;
  }

  function rowHtml(f) {
    const ts = state.model.stats.tagger;
    const tagger = state.measure === 'tagger';
    const t = tone(f);
    const sep = '<span class="text-zinc-300 dark:text-zinc-700" aria-hidden="true">·</span>';
    const warn = 'text-amber-700 dark:text-amber-300';
    let summary;
    if (f.tagged) {
      const p = f.parts;
      const classes = p.classification.length
        ? `<span class="code">${esc(p.classification.slice(0, 2).map(trimSlash).join(', '))}${p.classification.length > 2 ? ` +${p.classification.length - 2}` : ''}</span>`
        : `<span class="${p.special ? '' : warn}">no classification</span>`;
      summary = [
        `<span>Expressive <b class="font-semibold tabular-nums ${!p.special && p.eCount <= THIN_EXPRESSIVE ? warn : 'text-zinc-700 dark:text-zinc-300'}">${p.eCount}</b></span>`,
        `<span>Quality <b class="font-semibold tabular-nums ${p.qMissing.length ? warn : 'text-zinc-700 dark:text-zinc-300'}">${p.qHave}/${p.qTotal}</b></span>`,
        classes,
      ].join(sep);
    } else {
      summary = '<span>No tags yet</span>';
    }
    const issues = f.issues
      .filter((i) => !(i.key === 'untagged' && state.scope === 'untagged'))
      .map((i) => `<span class="chip ${i.key === 'untagged' ? 'chip-bad' : 'chip-warn'}" title="${esc(i.why)}">${esc(i.label)}</span>`).join('');
    const nonLatin = f.latin ? '' :
      `<span class="chip chip-muted" title="This family has no Latin subset, so the preview falls back to a system font">No Latin glyphs</span>`;

    const big = tagger ? taggerPct(f.tagger) : `${f.expected}%`;
    const caption = tagger ? `${f.taggerCount}/${ts.total} tags · exp. ${f.expected}%` : `tagger ${taggerPct(f.tagger)}`;
    const title = `Tagger: ${f.taggerCount} of ${ts.total} tags (${taggerPct(f.tagger)}). Expected: ${f.expected}%.`;

    return `
      <li data-name="${esc(f.name)}" data-q="${esc(f.preview.q)}" class="px-4 py-3 sm:px-5">
        <div class="grid items-center gap-x-5 gap-y-2 sm:grid-cols-[minmax(0,1fr)_7.5rem_auto]">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
              <span class="font-medium">${esc(f.name)}</span>
              <span class="chip chip-muted">${esc(f.category || 'Uncategorized')}</span>
              ${f.added ? `<span class="text-xs text-zinc-400 dark:text-zinc-500">Added ${esc(f.added)}</span>` : ''}
            </div>
            <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-zinc-500 dark:text-zinc-400">${summary}${issues || nonLatin ? `<span class="flex flex-wrap gap-1">${issues}${nonLatin}</span>` : ''}</div>
            <div class="preview mt-1 text-zinc-800 dark:text-zinc-200">${esc(state.sample || f.name)}</div>
          </div>
          <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 sm:flex-col sm:items-end" title="${esc(title)}">
            <span class="text-sm font-semibold tabular-nums ${t.text}">${big}</span>
            <span class="block h-1.5 w-24 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-800"><span class="block h-full rounded-full ${t.bar}" style="width:${measureOf(f)}%"></span></span>
            <span class="whitespace-nowrap text-[11px] tabular-nums text-zinc-400 dark:text-zinc-500">${caption}</span>
          </div>
          <div class="flex flex-wrap gap-1.5 sm:justify-end">
            ${f.tagged ? `<button type="button" class="row-action" data-expand aria-expanded="false">Tags <span class="tabular-nums text-zinc-400">${f.tags.length}</span><svg class="h-3 w-3 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>` : ''}
            <button type="button" class="row-action" data-copy="${esc(f.name)}">Copy</button>
            <a class="row-action" href="${esc(specimenUrl(f.name))}" target="_blank" rel="noopener">Specimen <span aria-hidden="true">↗</span></a>
            <a class="row-action" href="${TAGGER_URL}" target="_blank" rel="noopener" data-copy="${esc(f.name)}" data-tagger title="Copies the family name and opens the GF Tagger. Paste it into a “Tags in font” panel.">Tagger <span aria-hidden="true">↗</span></a>
          </div>
        </div>
        <div class="tag-panel hidden"></div>
      </li>`;
  }

  // Built on demand when a row's Tags panel is opened.
  function tagPanelHtml(f) {
    const m = state.model, p = f.parts, s = m.stats, ts = s.tagger;
    const scoreValue = (t) => Math.max(...String(t.score).split('–').map(Number).filter((x) => !Number.isNaN(x)), -1);
    const chip = (t, label) => `<button type="button" class="tag-chip" data-tag="${esc(t.path)}" title="List families tagged ${esc(t.path)}${t.vf ? '. Variable font: scored at several axis positions' : ''}">${esc(label)}${t.score !== '' ? ` <span class="tabular-nums text-zinc-400">${esc(t.score)}</span>` : ''}${t.vf ? ' <span class="text-[9px] font-semibold uppercase tracking-wide text-zinc-400">vf</span>' : ''}</button>`;
    const missingChip = (path, label, cls) => `<button type="button" class="tag-chip ${cls}" data-tag="!${esc(path)}" title="List families without ${esc(path)}. ${pct(s.share(path))} of tagged families have it.">${esc(label)} <span class="tabular-nums opacity-70">${pct(s.share(path))}</span></button>`;
    const section = (title, meta, body) => `
      <div>
        <div class="flex flex-wrap items-baseline gap-x-2"><span class="text-xs font-semibold uppercase tracking-wider text-zinc-700 dark:text-zinc-300">${title}</span><span class="text-zinc-500 dark:text-zinc-400">${meta}</span></div>
        <div class="mt-1.5 flex flex-wrap gap-1">${body}</div>
      </div>`;
    const inGroup = (g) => f.tags.filter((t) => t.group === g);

    const measures = `
      <div class="flex flex-wrap gap-x-4 gap-y-1 text-zinc-600 dark:text-zinc-400">
        <span><b class="font-semibold text-zinc-800 dark:text-zinc-200">Tagger ${taggerPct(f.tagger)}</b>: ${f.taggerCount} of ${ts.total} tags scored</span>
        <span><b class="font-semibold text-zinc-800 dark:text-zinc-200">Expected ${f.expected}%</b></span>
        ${f.notInTagger.length ? `<span class="text-amber-700 dark:text-amber-300">Not in the tagger's list (not counted): ${esc(f.notInTagger.join(', '))}</span>` : ''}
      </div>`;

    const issues = f.issues.length ? `
      <ul class="space-y-1 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-amber-900 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-200">
        ${f.issues.map((i) => `<li><span class="font-semibold">${esc(i.label)}.</span> ${esc(i.why)}</li>`).join('')}
      </ul>` : '';

    const expressive = inGroup('Expressive').sort((a, b) => scoreValue(b) - scoreValue(a));
    const expressiveBody = expressive.map((t) => chip(t, leaf(t.path))).join('') +
      (p.notScored.length ? `<span class="mx-1 self-center text-zinc-400">Not scored:</span>${p.notScored.map((path) => missingChip(path, leaf(path), 'tag-chip-missing')).join('')}` : '');

    const quality = inGroup('Quality').sort((a, b) => a.path.localeCompare(b.path));
    const qualityBody = quality.map((t) => chip(t, leaf(t.path))).join('') +
      p.qMissing.map((path) => missingChip(path, leaf(path) + ' missing', 'tag-chip-warn')).join('');

    const classification = f.tags.filter((t) => CLASSIFICATION_GROUPS.includes(t.group)).sort((a, b) => a.path.localeCompare(b.path));
    const classificationBody = classification.length
      ? classification.map((t) => chip(t, trimSlash(t.path))).join('')
      : `<span class="text-amber-700 dark:text-amber-300">None yet</span>`;
    const expectedText = p.expected === ANY_CLASSIFICATION
      ? 'any classification tag expected'
      : `${esc(f.category)} → ${esc(p.expected.label)} expected`;

    const known = new Set(['Expressive', 'Quality', ...CLASSIFICATION_GROUPS]);
    const other = f.tags.filter((t) => !known.has(t.group)).sort((a, b) => a.path.localeCompare(b.path));

    return `
      <div class="mt-3 space-y-3 rounded-lg border border-zinc-200 bg-zinc-50 p-3 text-xs dark:border-zinc-800 dark:bg-zinc-950/60">
        ${measures}
        ${issues}
        ${section('Expressive', `${p.eCount} of ${s.expressiveTotal} scored${p.special ? ' · special use, not required' : ` · ${s.expressiveTarget} counts as full on Expected`}`, expressiveBody || '<span class="text-zinc-400">None</span>')}
        ${section('Quality', `${p.qHave} of ${p.qTotal}`, qualityBody || '<span class="text-zinc-400">None</span>')}
        ${section('Classification', p.special ? 'special use' : expectedText, classificationBody)}
        ${other.length ? section('Other', '', other.map((t) => chip(t, trimSlash(t.path))).join('')) : ''}
      </div>`;
  }

  function renderStatus() {
    const el = $('#status');
    const meta = state.meta;
    const sources = `Sources: <a class="underline underline-offset-2" href="${META_URL}" target="_blank" rel="noopener">fonts.google.com/metadata/fonts</a>, <a class="underline underline-offset-2" href="${CSV_URL}" target="_blank" rel="noopener">families.csv</a> and the <a class="underline underline-offset-2" href="https://github.com/googlefonts/tagger/blob/main/public/tags_metadata.csv" target="_blank" rel="noopener">GF Tagger's tag list</a>.`;
    if (!meta || !state.model) { el.innerHTML = sources; return; }
    const ts = state.model.stats.tagger;
    el.innerHTML = `${sources}<br>Catalog via ${esc(meta.catalogSource)} · tags via ${esc(meta.tagSource)} · tag list via ${esc(ts.source || 'families.csv (tagger list unavailable)')} · fetched ${relativeTime(meta.fetchedAt)}${meta.fromCache ? ' (cached, refreshes after 24 h)' : ''}.`;
  }

  // Load each family's css2 stylesheet only when its row scrolls into view.
  const loadedFonts = new Set();
  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      observer.unobserve(entry.target);
      const q = entry.target.dataset.q;
      if (loadedFonts.has(q)) continue;
      loadedFonts.add(q);
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${q}&display=swap`;
      document.head.appendChild(link);
    }
  }, { rootMargin: '200px' });

  // ---------------------------------------------------------------------------
  // Banner / toast
  // ---------------------------------------------------------------------------
  function hideBanner() { const b = $('#banner'); b.classList.add('hidden'); b.innerHTML = ''; }

  function showError(title, failures) {
    const b = $('#banner');
    const detail = failures.map((f) => `
      <div class="mt-2"><span class="font-medium">${esc(f.what)}</span>
        <ul class="mt-0.5 list-disc pl-5 font-mono text-[11px] opacity-80">${f.details.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>
      </div>`).join('');
    b.innerHTML = `
      <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-200">
        <div class="font-semibold">${esc(title)}</div>
        <details class="mt-1"><summary class="cursor-pointer select-none opacity-80">What failed</summary>${detail}</details>
        <p class="mt-3 opacity-90">You can also load the files yourself. Save
          <a class="underline" href="${META_URL}" target="_blank" rel="noopener">the catalog JSON</a> and
          <a class="underline" href="${CSV_URL}" target="_blank" rel="noopener">families.csv</a>, then
          <button type="button" id="pick-files" class="font-semibold underline">choose the files</button>.</p>
      </div>`;
    b.classList.remove('hidden');
    $('#pick-files').addEventListener('click', () => $('#file-input').click());
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.remove('opacity-0', 'translate-y-2');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('opacity-0', 'translate-y-2'), 1800);
  }

  // ---------------------------------------------------------------------------
  // Export
  // ---------------------------------------------------------------------------
  function copySync(text) {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    return ok;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    return copySync(text);
  }

  function download(filename, mime, content) {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const csvCell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const statusOf = (f) => (!f.tagged ? 'untagged' : f.expected === 100 ? 'fully tagged' : 'partly tagged');

  function exportRecord(f) {
    const p = f.parts;
    return {
      family: f.name,
      category: f.category,
      taggerPct: Number(f.tagger.toFixed(2)),
      taggerTags: f.taggerCount,
      expectedPct: f.expected,
      status: statusOf(f),
      gaps: f.issues.map((i) => ({ type: i.key, label: i.label, detail: i.why })),
      missingQualityTags: p ? p.qMissing : [],
      expressiveScored: p ? p.eCount : 0,
      qualityScored: p ? `${p.qHave}/${p.qTotal}` : '',
      classificationTags: p ? p.classification : [],
      expressiveNotScored: p ? p.notScored : [],
      tags: Object.fromEntries(f.tags.map((t) => [t.path, t.vf ? { score: t.score, variable: true } : t.score])),
      dateAdded: f.added,
      specimenUrl: specimenUrl(f.name),
    };
  }

  async function doExport(kind) {
    const rows = currentRows();
    if (!rows.length) return;
    const stamp = new Date().toISOString().slice(0, 10);
    const base = `untagger-${state.scope === 'all' ? 'all-families' : state.scope === 'partial' ? 'partly-tagged' : 'untagged'}-${stamp}`;
    const names = rows.map((f) => f.name).join('\n') + '\n';
    const ts = state.model.stats.tagger;

    if (kind === 'copy') {
      toast((await copyText(names)) ? `Copied ${fmt.format(rows.length)} ${rows.length === 1 ? 'name' : 'names'}` : 'Copy failed');
    } else if (kind === 'txt') {
      download(base + '.txt', 'text/plain;charset=utf-8', names);
    } else if (kind === 'csv') {
      const header = ['family', 'category', 'tagger_pct', 'tagger_tags', 'expected_pct', 'status', 'gaps', 'missing_quality_tags', 'expressive_scored', 'quality_scored', 'classification_tags', 'date_added', 'specimen_url'];
      const lines = rows.map((f) => {
        const r = exportRecord(f);
        return [r.family, r.category, r.taggerPct, `${r.taggerTags}/${ts.total}`, r.expectedPct, r.status, r.gaps.map((g) => g.label).join('; '),
          r.missingQualityTags.join('; '), r.expressiveScored, r.qualityScored, r.classificationTags.join('; '), r.dateAdded, r.specimenUrl].map(csvCell).join(',');
      });
      download(base + '.csv', 'text/csv;charset=utf-8', [header.join(','), ...lines].join('\n') + '\n');
    } else if (kind === 'json') {
      const t = state.model.totals;
      const payload = {
        generatedAt: new Date().toISOString(),
        dataFetchedAt: state.meta ? new Date(state.meta.fetchedAt).toISOString() : null,
        sources: { catalog: META_URL, tags: CSV_URL, taggerTagList: ts.source || 'families.csv' },
        view: { show: state.scope, measure: state.measure, search: state.query || null, category: state.category || null, gaps: state.issue || null, taggerPct: state.tpct || null, expectedPct: state.epct || null, sort: state.sort },
        totals: { catalog: t.catalog, tagged: t.tagged, fullyTaggedExpected: t.expectedFull, partlyTagged: t.partial, untagged: t.untagged, taggerTagCount: ts.total, taggerCompletenessPct: Number(ts.completeness.toFixed(3)) },
        count: rows.length,
        families: rows.map(exportRecord),
      };
      download(base + '.json', 'application/json', JSON.stringify(payload, null, 2) + '\n');
    }
  }

  // ---------------------------------------------------------------------------
  // Refresh cooldown
  // ---------------------------------------------------------------------------
  const cooldownLeft = () => Math.max(0, (Number(store.get(COOLDOWN_KEY)) || 0) + COOLDOWN_MS - Date.now());

  function tickCooldown() {
    const left = cooldownLeft();
    const btn = $('#refresh');
    btn.disabled = left > 0 || state.loading;
    $('#refresh-label').textContent = left > 0 ? `Refresh in ${Math.ceil(left / 1000)}s` : state.loading ? 'Loading…' : 'Refresh';
    btn.title = left > 0 ? 'Cooldown to avoid rate limits' : 'Fetch fresh data, ignoring the 24 h cache';
  }
  setInterval(tickCooldown, 500);

  // ---------------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------------
  function update(changes) {
    Object.assign(state, changes, { limit: PAGE_SIZE });
    render();
  }

  $('#refresh').addEventListener('click', async () => {
    if (cooldownLeft() > 0 || state.loading) return;
    store.set(COOLDOWN_KEY, String(Date.now()));
    tickCooldown();
    await load({ fresh: true });
    tickCooldown();
  });

  $('#theme').addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark');
    store.set('gfu:theme', dark ? 'dark' : 'light');
  });

  document.querySelectorAll('[data-scope]').forEach((btn) =>
    btn.addEventListener('click', () => update({ scope: btn.dataset.scope })));
  document.querySelectorAll('button[data-view]').forEach((btn) =>
    btn.addEventListener('click', () => update({ view: btn.dataset.view })));
  document.querySelectorAll('button[data-measure]').forEach((btn) =>
    btn.addEventListener('click', () => update({ measure: btn.dataset.measure })));

  let searchTimer;
  $('#search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => update({ query: e.target.value }), 120);
  });
  $('#category').addEventListener('change', (e) => update({ category: e.target.value }));
  $('#issue').addEventListener('change', (e) => update({ issue: e.target.value }));
  $('#tpct').addEventListener('change', (e) => update({ tpct: e.target.value }));
  $('#epct').addEventListener('change', (e) => update({ epct: e.target.value }));
  $('#sort').addEventListener('change', (e) => update({ sort: e.target.value }));
  $('#reset').addEventListener('click', () => update({ query: '', category: '', issue: '', tpct: '', epct: '' }));
  $('#sample').addEventListener('input', (e) => {
    state.sample = e.target.value;
    document.querySelectorAll('#list .preview').forEach((p) => {
      p.textContent = state.sample || p.closest('li').dataset.name;
    });
  });

  document.querySelectorAll('.export-btn').forEach((btn) =>
    btn.addEventListener('click', () => doExport(btn.dataset.export)));

  $('#list').addEventListener('click', (e) => {
    const more = e.target.closest('#more');
    if (more) {
      state.limit += PAGE_SIZE;
      renderList();
      return;
    }

    const expand = e.target.closest('[data-expand]');
    if (expand) {
      const li = expand.closest('li');
      const panel = li.querySelector('.tag-panel');
      if (!panel.innerHTML) panel.innerHTML = tagPanelHtml(state.model.byName.get(li.dataset.name));
      const open = panel.classList.toggle('hidden') === false;
      expand.setAttribute('aria-expanded', String(open));
      expand.querySelector('svg').classList.toggle('rotate-180', open);
      return;
    }

    const tag = e.target.closest('[data-tag]');
    if (tag) {
      update({ query: tag.dataset.tag, scope: 'all', issue: '', tpct: '', epct: '' });
      $('#list').scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast(tag.dataset.tag.startsWith('!') ? `Families without ${tag.dataset.tag.slice(1)}` : `Families tagged ${tag.dataset.tag}`);
      return;
    }

    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    const name = btn.dataset.copy;
    if ('tagger' in btn.dataset) {
      // Copy synchronously, before the link opens the tagger and this page loses focus.
      toast(copySync(name) ? `Copied “${name}”. Paste it into the tagger` : 'Copy failed');
      return;
    }
    copyText(name).then((ok) => toast(ok ? `Copied “${name}”` : 'Copy failed'));
  });

  $('#file-input').addEventListener('change', (e) => {
    if (e.target.files.length) loadFiles([...e.target.files]);
    e.target.value = '';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      $('#search').focus();
    }
  });

  window.addEventListener('hashchange', () => { readUrl(); state.limit = PAGE_SIZE; render(); });

  // Keep the "fetched N min ago" line current.
  setInterval(renderStatus, 60 * 1000);

  readUrl();
  tickCooldown();
  render();
  load();
})();
</script>
</body>
</html>
